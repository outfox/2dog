[project]
name = "2dog"
version = "0.1.0"
description = "2dog is Godot, but backwards! Embed libgodot in C# to run games, apps, tools, CI, unit tests, and more."
authors = [
    {name = "Moritz Voss",email = "mail@moritzvoss.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "poethepoet>=0.40.0",
    "rich>=14.2.0",
    "scons (>=4.9.1,<5.0.0)",
]


[tool.poetry]
package-mode = false

[tool.poe.tasks]
version = "version:echo"

[tool.poe.tasks.build-godot]
help = "Godot build: build libgodot and glue code"
sequence = [
    { cmd = "uv run build-godot.py" },
]

[tool.poe.tasks.build-managed]
help = "dotnet pack: bindings, engine, Avalonia, Blazor, xUnit, NUnit, gdUnit, REPL, tool and restore"
sequence = [
    { cmd = "uv run scripts/dotnet_build.py pack twodog.godotsharp" },
    { cmd = "uv run scripts/dotnet_build.py pack twodog.godotsharp.editor" },
    { cmd = "uv run scripts/dotnet_build.py pack twodog.engine" },
    { cmd = "uv run scripts/dotnet_build.py pack twodog.avalonia" },
    { cmd = "uv run scripts/dotnet_build.py pack twodog.blazor" },
    { cmd = "uv run scripts/dotnet_build.py pack twodog.xunit" },
    { cmd = "uv run scripts/dotnet_build.py pack twodog.nunit" },
    { cmd = "uv run scripts/dotnet_build.py pack twodog.gdunit" },
    { cmd = "uv run scripts/dotnet_build.py pack twodog.repl" },
    { cmd = "uv run scripts/dotnet_build.py pack twodog" },
    { cmd = "uv run scripts/dotnet_build.py restore" },
]

[tool.poe.tasks.build]
help = "dotnet build: Platform packages (all platforms), twodog library, and NuGet packages"
sequence = [
    { cmd = "uv run scripts/dotnet_build.py pack platforms -p:ForcePackAllPlatforms=true" },
    { ref = "build-managed" },
]

[tool.poe.tasks.build-maui]
help = "Pack the Windows/Android/iOS MAUI integration and the iOS host glue (requires maui-windows, maui-android, maui-ios and ios workloads on Windows)"
sequence = [
    { cmd = "uv run scripts/dotnet_build.py pack twodog.ios" },
    { cmd = "uv run scripts/dotnet_build.py pack twodog.maui" },
]

[tool.poe.tasks.build-godot-local]
help = "Fast incremental libgodot build for the host platform only (skips editor executable and mono glue; needs one prior full build-godot)"
cmd = "uv run build-godot.py --no-editor --no-glue"

# Note: build-local still force-packs all platform packages. Non-host packages
# without natives pack as tiny empty stubs in seconds - and those stubs are what
# keeps the final `dotnet restore` from downloading the real (25-77 MB) natives
# for other platforms from nuget.org, since 2dog.engine references all platforms.
[tool.poe.tasks.build-local]
help = "Fast partial build: incremental host-only libgodot (skips editor/glue), then the normal package build"
sequence = [
    { ref = "build-godot-local" },
    { ref = "build" },
]

[tool.poe.tasks.nuget-retire]
help = "Retire old package versions on nuget.org: plan (default) / unlist / deprecate. Args are passed through, see scripts/nuget_retire.py --help"
cmd = "uv run scripts/nuget_retire.py"

[tool.poe.tasks.build-all]
help = "Complete build: Godot engine, platform packages, twodog library, and NuGet packages"
sequence = [
    { ref = "build-godot" },
    { ref = "build" },
]

[tool.poe.tasks.build-android]
help = "Experimental Android arm64/x64 natives and Java payloads (requires Android SDK, JDK 17 and desktop Mono glue)"
sequence = [
    { cmd = "uv run build-godot.py --platform android --arch arm64" },
    { cmd = "uv run build-godot.py --platform android --arch x86_64" },
    { cmd = "uv run scripts/build_android_java.py" },
    { ref = "pack-android" },
]

[tool.poe.tasks.pack-android]
help = "Pack experimental Android runtime and Java host packages"
sequence = [
    { cmd = "uv run scripts/dotnet_build.py pack platforms/twodog.android-arm64/twodog.android-arm64.csproj" },
    { cmd = "uv run scripts/dotnet_build.py pack platforms/twodog.android-x64/twodog.android-x64.csproj" },
    { cmd = "uv run scripts/dotnet_build.py pack platforms/twodog.android/twodog.android.csproj" },
]

[tool.poe.tasks.build-ios]
help = "Experimental iOS device and Simulator archives (requires macOS with Xcode and desktop Mono glue)"
sequence = [
    { cmd = "uv run build-godot.py --platform ios" },
    { cmd = "uv run build-godot.py --platform ios --simulator" },
    { ref = "pack-ios" },
]

[tool.poe.tasks.pack-ios]
help = "Pack experimental iOS runtime packages (the 2dog.ios host glue packs with build-maui, which needs the ios workload)"
sequence = [
    { cmd = "uv run scripts/dotnet_build.py pack platforms/twodog.ios-arm64/twodog.ios-arm64.csproj" },
    { cmd = "uv run scripts/dotnet_build.py pack platforms/twodog.iossimulator-arm64/twodog.iossimulator-arm64.csproj" },
]

[tool.poe.tasks.test-ios-build]
help = "iOS build, package and script tests (no Mac, device or workload required)"
cmd = "uv run python -m unittest discover -s tests/ios -p 'test_*.py'"

[tool.poe.tasks.build-ios-app]
help = "Build and inspect the iOS smoke (or --app showcase) app bundle from local packages; macOS with Xcode only"
cmd = "uv run scripts/build_ios_app.py"

[tool.poe.tasks.test-android-build]
help = "Android build and package tests (no device/workload required)"
cmd = "uv run python -m unittest discover -s tests/android -p 'test_*.py'"

[tool.poe.tasks.build-android-apk]
help = "Build and inspect the Android smoke (or --app showcase) APK from local packages; pass --editor"
cmd = "uv run scripts/build_android_apk.py"

[tool.poe.tasks.publish-android]
help = "Publish an experimental Android host to APK/AAB; pass project and --pack"
cmd = "uv run scripts/publish_android.py"


# Double precision builds keep native and managed ABIs together. The CLI/template is precision-neutral.
[tool.poe.tasks.build-double-godot]
help = "Build host natives, editor and C# glue with double precision"
cmd = "uv run build-godot.py --precision double"

[tool.poe.tasks.pack-double]
help = "Pack .double engine/bindings/natives and ordinary precision-neutral integrations"
sequence = [
    { cmd = "uv run scripts/dotnet_build.py pack platforms -p:TwoDogPrecision=double -p:ForcePackAllPlatforms=true" },
    { cmd = "uv run scripts/dotnet_build.py pack twodog.godotsharp -p:TwoDogPrecision=double" },
    { cmd = "uv run scripts/dotnet_build.py pack twodog.godotsharp.editor -p:TwoDogPrecision=double" },
    { cmd = "uv run scripts/dotnet_build.py pack twodog.engine -p:TwoDogPrecision=double" },
    { cmd = "uv run scripts/dotnet_build.py pack twodog.avalonia -p:TwoDogPrecision=double" },
    { cmd = "uv run scripts/dotnet_build.py pack twodog.blazor -p:TwoDogPrecision=double" },
    { cmd = "uv run scripts/dotnet_build.py pack twodog.xunit -p:TwoDogPrecision=double" },
    { cmd = "uv run scripts/dotnet_build.py pack twodog.nunit -p:TwoDogPrecision=double" },
    { cmd = "uv run scripts/dotnet_build.py pack twodog.gdunit -p:TwoDogPrecision=double" },
    { cmd = "uv run scripts/dotnet_build.py pack twodog.repl -p:TwoDogPrecision=double" },
    { cmd = "uv run scripts/dotnet_build.py restore -p:TwoDogPrecision=double" },
]

[tool.poe.tasks.build-double]
help = "Build and pack a complete host-platform double-precision 2dog distribution"
sequence = [
    { ref = "build-double-godot" },
    { ref = "pack-double" },
]
