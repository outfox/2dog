# Emergency/manual fallback to running scripts/release.nu locally: dispatch it on main. The script computes the
# versions, commits the bump, tags it and pushes; another Godot line (godot-lines.json) pushes only its tag.
#
# Uses only the default GITHUB_TOKEN. Tags pushed with GITHUB_TOKEN do not fire `on: push` (GitHub's anti-recursion
# rule), so this workflow then dispatches ci.yml on the new tag; workflow_dispatch is exempt from that rule.
name: 2dog Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Compute and preview without committing, tagging or pushing'
        required: false
        type: boolean
        default: false
      line:
        description: 'Another Godot line from godot-lines.json (4.7); empty releases the line in the tree'
        required: false
        type: string
        default: ''

permissions:
  contents: write # push the bump commit and tag
  actions: write  # dispatch ci.yml on the new tag

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'outfox/2dog'
    name: Bump, Tag, and Push
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Nushell
        uses: hustcer/setup-nu@eacad52a4634c4f8d17a94916f93be6856861b9c # v3.29
        with:
          version: '0.111.0'

      - name: Release
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          LINE: ${{ inputs.line }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          args=(--no-sign)
          if [ "$DRY_RUN" = true ]; then args+=(--dry-run); fi
          if [ -n "$LINE" ]; then args+=(--line "$LINE"); fi
          nu scripts/release.nu "${args[@]}"

      # Tags pushed with GITHUB_TOKEN don't fire `on: push`, so trigger the CI (and thereby the staging) explicitly.
      # Another line's release leaves HEAD on main, so the tag is found by name: this checkout fetched no other tag.
      - name: Dispatch CI on the new tag
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$(git tag --list 'v*' --sort=-creatordate | head -n 1)"
