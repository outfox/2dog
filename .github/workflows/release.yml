# Emergency/manual fallback to running scripts/release.nu locally: dispatch it on the branch to release (main, 4.7,
# 4.8.0-beta, ...). The script computes the versions, commits the bump, tags it and pushes both atomically.
# shortcut: releases the line in the tree only; add a line input passing --line when another line needs this fallback.
#
# Uses only the default GITHUB_TOKEN. Tags pushed with GITHUB_TOKEN do not fire `on: push` (GitHub's anti-recursion
# rule), so this workflow then dispatches ci.yml on the new tag; workflow_dispatch is exempt from that rule.
name: 2dog Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Compute and preview without committing, tagging or pushing'
        required: false
        type: boolean
        default: false

permissions:
  contents: write # push the bump commit and tag
  actions: write  # dispatch ci.yml on the new tag

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'outfox/2dog'
    name: Bump, Tag, and Push
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Nushell
        uses: hustcer/setup-nu@eacad52a4634c4f8d17a94916f93be6856861b9c # v3.29
        with:
          version: '0.111.0'

      - name: Release
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$DRY_RUN" = true ]; then
            nu scripts/release.nu --no-sign --dry-run
          else
            nu scripts/release.nu --no-sign
          fi

      # Tags pushed with GITHUB_TOKEN don't fire `on: push`, so trigger the CI (and thereby the staging) explicitly.
      - name: Dispatch CI on the new tag
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$(git describe --tags --exact-match HEAD)"
