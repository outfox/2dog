# Serialize tag creation. Each pushed tag gets its own CI run.
name: 2dog Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Compute and preview without committing, tagging or pushing'
        required: false
        type: boolean
        default: false
      lines:
        description: 'Comma-separated Godot lines (e.g. 4.7,4.8); empty releases all configured lines'
        required: false
        type: string
        default: ''

permissions:
  contents: write # push the bump commit and tag
  actions: write  # dispatch ci.yml on the new tag

env:
  UV_LOCKED: '1'

concurrency:
  group: release
  queue: max
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'outfox/2dog' && github.ref == 'refs/heads/main'
    name: Bump, Tag, and Push
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: main # A queued run needs the current tip after it acquires the lock.

      - name: Setup Nushell
        uses: hustcer/setup-nu@eacad52a4634c4f8d17a94916f93be6856861b9c # v3.29
        with:
          version: '0.111.0'

      - name: Setup uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: '3.12'
          enable-cache: false

      - name: Release
        id: batch
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          RELEASE_LINES: ${{ inputs.lines }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
          RELEASE_SIGNING_EMAIL: ${{ vars.RELEASE_SIGNING_EMAIL }}
          GODOT_RELEASE_DEPLOY_KEY: ${{ secrets.GODOT_RELEASE_DEPLOY_KEY }}
        run: |
          git config submodule.godot.url https://github.com/outfox/godot.git
          git submodule update --init --depth 1 godot
          args=(--batch --lines "$RELEASE_LINES")
          if [ "$DRY_RUN" = true ]; then
            args+=(--dry-run)
            if [ -z "$RELEASE_SIGNING_KEY" ] && [ -z "$GODOT_RELEASE_DEPLOY_KEY" ]; then
              nu scripts/release.nu "${args[@]}"
              exit
            fi
          fi

          : "${RELEASE_SIGNING_KEY:?Set the dedicated release signing key}"
          : "${RELEASE_SIGNING_EMAIL:?Set the signer account email}"
          : "${GODOT_RELEASE_DEPLOY_KEY:?Set the Godot fork write deploy key}"
          umask 077
          keys=$(mktemp -d)
          trap 'rm -f -- "$keys/signer" "$keys/fork" "$keys/known_hosts"; rmdir -- "$keys"' EXIT
          printf '%s\n' "$RELEASE_SIGNING_KEY" > "$keys/signer"
          printf '%s\n' "$GODOT_RELEASE_DEPLOY_KEY" > "$keys/fork"
          unset RELEASE_SIGNING_KEY GODOT_RELEASE_DEPLOY_KEY
          gh api meta --jq '.ssh_keys[] | "github.com " + .' > "$keys/known_hosts"
          export GIT_SSH_COMMAND="ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile='$keys/known_hosts' -i '$keys/fork'"
          git config user.name "2dog Release"
          git config user.email "$RELEASE_SIGNING_EMAIL"
          git config gpg.format ssh
          git config user.signingkey "$keys/signer"

          if [ "$DRY_RUN" = true ]; then
            ssh-keygen -y -P '' -f "$keys/signer" >/dev/null
            pin=$(git rev-parse HEAD:godot)
            git -C godot push --dry-run git@github.com:outfox/godot.git "$pin:refs/tags/2dog-pin-$pin"
          fi
          nu scripts/release.nu "${args[@]}"

      # Tags pushed with GITHUB_TOKEN need an explicit dispatch.
      - name: Dispatch CI on each new tag
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAGS: ${{ steps.batch.outputs.tags }}
        run: |
          : "${RELEASE_TAGS:?The release batch did not report any tags}"
          read -r -a tags <<< "$RELEASE_TAGS"
          failed=0
          for tag in "${tags[@]}"; do
            line=$(cut -d. -f1-2 <<< "${tag#v}")
            if ! gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$tag" -f release_line="$line"; then
              echo "::error::Retry CI with: gh workflow run ci.yml --repo $GITHUB_REPOSITORY --ref $tag -f release_line=$line"
              failed=1
            fi
          done
          exit "$failed"
