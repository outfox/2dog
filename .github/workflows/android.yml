name: 2dog Android foundations

on:
  workflow_dispatch:
  push:
    branches: [android]
    paths:
      - 'platforms/**'
      - 'scripts/*android*.py'
      - 'tests/android/**'
      - 'build-godot.py'
      - 'Directory.Build.*'
      - '2dog.slnx'
      - '.github/workflows/android.yml'

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - run: python -m pip install 'rich>=14.2.0'
      - name: Test native build commands and packed Android targets
        run: python -m unittest discover -s tests/android -p 'test_*.py' -v
