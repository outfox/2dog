name: 2dog Android build and package tests

on:
  workflow_dispatch:
  # Every pull request, unfiltered: a required status check has to report, and a path-filtered workflow that is
  # skipped never does.
  pull_request:
  push:
    branches: [main, 'android*']
    paths:
      - 'platforms/**'
      - 'scripts/*android*.py'
      - 'tests/android/**'
      - 'twodog.engine/**'
      - 'build-godot.py'
      - 'Directory.Build.*'
      - '2dog.slnx'
      - 'global.json'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/android.yml'

permissions:
  contents: read

env:
  UV_LOCKED: '1'

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-package-tests:
    if: github.repository == 'outfox/2dog'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: '3.12'
          enable-cache: false
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Test native build commands and packed Android targets
        run: uv run poe test-android-build
