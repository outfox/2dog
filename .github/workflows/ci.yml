name: 2dog CI

on:
  push:
    branches: ['**']
    tags: ['v*']
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '**/AGENTS.md'
  # No pull_request trigger: push already runs on every branch, so a PR
  # would run CI twice. Caveat: PRs from forks get no CI without it.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }} # never cancel tag/deploy runs

# Keep the iOS bindings/workload matched to the Simulator runner's Xcode.
env:
  IOS_DOTNET_VERSION: 10.0.401
  IOS_WORKLOAD_VERSION: 10.0.401

permissions:
  contents: read # jobs that need more (build-natives, deploy) declare their own

jobs:
  # Pure gate: compute the godot submodule hash and check whether a complete
  # pre-built godot-<hash> natives release exists. When it is missing (or predates
  # the Android payloads), the build-natives job below builds it inline, so every
  # run self-heals in a single run graph.
  check-natives:
    if: github.repository == 'outfox/2dog'
    name: Check Native Libraries
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read # find the CI run of a release tag's parent commit
    outputs:
      ready: ${{ steps.check.outputs.ready }}
      double-ready: ${{ steps.check.outputs.double-ready }}
      hash: ${{ steps.check.outputs.hash }}
      tested-bump: ${{ steps.release.outputs.tested-bump }}
      tested-content: ${{ steps.content.outputs.tested-content }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 2 # a release tag is compared with its parent commit

      - name: Test CI helpers
        run: |
          bash .github/scripts/find-tested-run.test.sh
          bash .github/scripts/push-nuget.test.sh
          bash .github/scripts/stage-ci-inputs.test.sh

      - name: Check native library availability
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          HASH=$(git ls-tree HEAD godot | awk '{print $3}' | cut -c1-7)
          echo "hash=$HASH" >> $GITHUB_OUTPUT
          echo "Godot submodule hash: $HASH"

          if bash scripts/check_natives_release.sh "godot-$HASH"; then
            echo "ready=true" >> $GITHUB_OUTPUT
          else
            echo "::notice::No complete natives release for godot submodule $HASH — building inline."
            echo "ready=false" >> $GITHUB_OUTPUT
          fi
          if bash scripts/check_natives_release.sh "godot-$HASH-double"; then
            echo "double-ready=true" >> $GITHUB_OUTPUT
          else
            echo "::notice::No double-precision natives for $HASH; building inline."
            echo "double-ready=false" >> $GITHUB_OUTPUT
          fi

      # release.yml tags a commit that only bumps <TwoDogRevision> on top of main. When that parent already passed
      # the test, desktop and Android jobs, the tag run skips them; it still packs, runs the web and tool smoke
      # jobs against the versioned packages and deploys. Anything else gets the full run.
      - name: Check for a tested revision bump
        id: release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tested=false
          parents=$(git rev-list --parents -n 1 HEAD | wc -w)
          changed=$(git diff --name-only HEAD^ HEAD 2>/dev/null || true)
          lines=$(git diff -U0 HEAD^ HEAD -- Directory.Build.props 2>/dev/null |
            grep -E '^[+-]' | grep -vE '^(\+\+\+|---) ' || true)
          if [ "$parents" -eq 2 ] && [ "$changed" = "Directory.Build.props" ] && [ "$(echo "$lines" | wc -l)" -eq 2 ] &&
             ! echo "$lines" | grep -qv '<TwoDogRevision>'; then
            parent=$(git rev-parse HEAD^)
            # Any run that tested the parent's content counts, also one on the branch the parent merged.
            if found=$(bash .github/scripts/find-tested-run.sh "$parent" Test "Test Contracts" "Test Build Configuration" "Test Binding Packages" "Test Rendering" "Desktop Smoke" "WebGPU Desktop" "Android Smoke" "iOS Smoke"); then
              read -r run sha <<<"$found"
              echo "::notice::Parent ${parent:0:7}'s content passed CI in run $run (${sha:0:7}); skipping test, desktop and Android jobs."
              tested=true
            fi
          fi
          [ "$tested" = true ] || echo "::notice::Not a revision bump on a tested commit; running every job."
          echo "tested-bump=$tested" >> "$GITHUB_OUTPUT"

      # A branch push whose content already passed every job family elsewhere (typically the merge of a tested,
      # up-to-date branch) skips natives, pack, test and smoke jobs.
      # Tags keep their own rule above; manual dispatches always run in full.
      - name: Check for already-tested content
        id: content
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if found=$(bash .github/scripts/find-tested-run.sh "$GITHUB_SHA" Test "Test Contracts" "Test Build Configuration" "Test Binding Packages" "Test Rendering" "Desktop Smoke" "WebGPU Desktop" \
               "Web Smoke" "WebGPU Browser" "MAUI Builds" "Tool Smoke" "Android Smoke" "iOS Smoke"); then
            read -r run sha <<<"$found"
            url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$run"
            echo "::notice::This content passed CI in run $run (${sha:0:7}); skipping natives, pack, test and smoke jobs."
            echo "Content already verified by [run $run]($url) on \`${sha:0:7}\`: natives, pack, test and smoke jobs skipped." \
              >> "$GITHUB_STEP_SUMMARY"
            echo "tested-content=true" >> "$GITHUB_OUTPUT"
          else
            echo "tested-content=false" >> "$GITHUB_OUTPUT"
          fi

  # Build missing natives inline via the reusable workflow. The concurrency
  # group makes a second run that needs the same hash wait instead of building
  # twice; when it proceeds, the callee's preflight finds the release and
  # skips. Deliberately distinct from the callee release job's group
  # (natives-release-*): sharing it would deadlock, since this caller job
  # holds its group for the callee's entire duration.
  build-natives:
    name: Build Natives
    needs: [check-natives]
    if: >-
      github.repository == 'outfox/2dog' &&
      (needs.check-natives.outputs.ready != 'true' && needs.check-natives.outputs.tested-content != 'true')
    permissions:
      contents: write # callee's release job creates the godot-<hash> release
    concurrency:
      group: natives-build-${{ needs.check-natives.outputs.hash }}
      cancel-in-progress: false
    uses: ./.github/workflows/build-natives.yml
    with:
      create_release: true

  build-double-natives:
    name: Build Double Natives
    needs: [check-natives]
    if: >-
      github.repository == 'outfox/2dog' &&
      (needs.check-natives.outputs.double-ready != 'true' && needs.check-natives.outputs.tested-content != 'true')
    permissions:
      contents: write
    concurrency:
      group: natives-build-double-${{ needs.check-natives.outputs.hash }}
      cancel-in-progress: false
    uses: ./.github/workflows/build-natives.yml
    with:
      precision: double
      create_release: true

  # These checks use fixtures and source only, so they can run while natives are built or packages are packed.
  test-build-configuration:
    name: Test Build Configuration
    needs: [check-natives]
    if: >-
      github.repository == 'outfox/2dog' &&
      (!cancelled() && needs.check-natives.result == 'success' && needs.check-natives.outputs.tested-content != 'true')
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Setup uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: '3.12'
          enable-cache: false

      - name: Test build configuration and package fixtures
        run: |
          uv run python -m unittest discover -s tests/precision -v
          uv run python -m unittest discover -s tests/webgpu -v
          uv run python -m unittest discover -s tests/ci_packages -v
          uv run python -m unittest discover -s tests/ios -v

  # Download pre-built native libraries, stage godot/bin, and pack all
  # NuGet packages for the test jobs. The game project is imported by the
  # test jobs themselves via the automatic MSBuild import step.
  pack:
    name: Pack NuGet Packages (${{ matrix.precision }})
    needs: [check-natives, build-natives, build-double-natives]
    # Skip-tolerant gate, not always(): run when build-natives succeeded or was
    # skipped (natives already existed), never after a failed natives build. Skipping
    # pack for already-tested content skips every job downstream of it.
    if: >-
      github.repository == 'outfox/2dog' &&
      (!cancelled() && needs.check-natives.result == 'success' &&
      needs.check-natives.outputs.tested-content != 'true' &&
      (needs.build-natives.result == 'success' || needs.build-natives.result == 'skipped') &&
      (needs.build-double-natives.result == 'success' || needs.build-double-natives.result == 'skipped'))
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        precision: [single, double]

    env:
      TwoDogPrecision: ${{ matrix.precision }}
      TWODOG_BUILD_SUBDIR: ${{ matrix.precision == 'double' && 'double/' || '' }}
      TWODOG_NATIVE_SUFFIX: ${{ matrix.precision == 'double' && '.double' || '' }}
      TWODOG_RELEASE_SUFFIX: ${{ matrix.precision == 'double' && '-double' || '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # Release tags must point at a commit whose Directory.Build.props composes the
      # same version, otherwise the packed binaries would be labeled with a stale
      # version (see v4.7.0.26, which shipped 4.7.0.25 binaries).
      # Ref check only (no event check): tag builds arrive either as a direct tag
      # push or as a workflow_dispatch on the tag from release.yml.
      - name: Verify tag matches TwoDogVersion
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          PROPS_VERSION="$(dotnet msbuild twodog.engine/twodog.engine.csproj -getProperty:TwoDogVersion | tr -d '[:space:]')"
          echo "Tag version: $TAG_VERSION"
          echo "Props version: $PROPS_VERSION"
          if [[ "$TAG_VERSION" != "$PROPS_VERSION" ]]; then
            echo "::error::Tag v$TAG_VERSION does not match TwoDogVersion $PROPS_VERSION from Directory.Build.props." \
                 "Tag the commit that bumps <TwoDogRevision>, or use the Release workflow."
            exit 1
          fi

      # The platform packages are versioned by <NativesRevision>, which must be
      # bumped whenever the godot submodule changes. If it isn't, deploy's
      # skip-duplicate push silently keeps the previously published natives.
      # Each platform package records the submodule commit it was built from in
      # its repository metadata (see platforms/Directory.Build.props) — compare
      # the published package's commit with ours and fail on a mismatch.
      - name: Verify NativesVersion is not already published from different natives
        run: |
          NATIVES_VERSION="$(dotnet msbuild twodog.engine/twodog.engine.csproj -getProperty:NativesVersion | tr -d '[:space:]')"
          # NuGet normalizes away a trailing .0 fourth segment (4.7.2.0 -> 4.7.2).
          NORMALIZED="$(echo "$NATIVES_VERSION" | sed -E 's/^([0-9]+\.[0-9]+\.[0-9]+)\.0$/\1/')"
          CURRENT_COMMIT="$(git rev-parse HEAD:godot)"
          echo "NativesVersion: $NORMALIZED, godot submodule: $CURRENT_COMMIT"

          # Probe one representative platform package; all of them are packed
          # and pushed together. Must be a variant package (.debug/.release/
          # .editor) — the meta packages use a custom NuspecFile and carry no
          # repository stamp.
          ID="2dog.win-x64.debug${TWODOG_NATIVE_SUFFIX}"
          URL="https://api.nuget.org/v3-flatcontainer/$ID/$NORMALIZED/$ID.$NORMALIZED.nupkg"
          if ! curl -fsSL -o /tmp/published-natives.nupkg "$URL"; then
            echo "Natives $NORMALIZED not on nuget.org yet — nothing to collide with."
            exit 0
          fi

          # Note: packages published before the stamping target existed carry
          # the SDK's automatic SourceLink stamp (the 2dog repo commit, not the
          # submodule) — those hit the mismatch path below, which is the right
          # verdict: they cannot be confirmed to contain the current natives.
          PUBLISHED_COMMIT="$(unzip -p /tmp/published-natives.nupkg '*.nuspec' | sed -n 's/.*commit="\([0-9a-f]*\)".*/\1/p' | head -1)"
          if [ -z "$PUBLISHED_COMMIT" ]; then
            echo "::warning::Natives $NORMALIZED is on nuget.org without any recorded commit. Cannot verify — if the submodule changed since that release, bump <NativesRevision>."
          elif [ "$PUBLISHED_COMMIT" != "$CURRENT_COMMIT" ]; then
            echo "::error::Natives $NORMALIZED is already on nuget.org and its recorded source commit ${PUBLISHED_COMMIT:0:7} does not match the current godot submodule ${CURRENT_COMMIT:0:7}. Deploy would skip-duplicate and keep the stale natives. Bump <NativesRevision> in Directory.Build.props."
            exit 1
          else
            echo "Natives $NORMALIZED already published from the same godot commit — repack is identical, skip-duplicate is harmless."
          fi

      - name: Download native libraries from release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="godot-${{ needs.check-natives.outputs.hash }}${TWODOG_RELEASE_SUFFIX}"
          echo "Looking for release: $TAG"
          mkdir -p release-assets
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir release-assets
          echo "Downloaded assets:"
          ls -lh release-assets/

      - name: Setup uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: '3.12'
          enable-cache: false

      - name: Stage godot/bin directory
        run: uv run scripts/stage_natives_release.py release-assets --precision ${{ matrix.precision }}

      - name: Pack platform NuGet packages
        run: |
          mkdir -p packages
          dotnet pack platforms/ -p:ForcePackAllPlatforms=true

      - name: Pack managed bindings
        run: |
          dotnet pack twodog.godotsharp
          dotnet pack twodog.godotsharp.editor

      - name: Build twodog library (all configs)
        run: |
          dotnet build twodog.engine -c Debug
          dotnet build twodog.engine -c Release
          dotnet build twodog.engine -c Editor

      - name: Pack twodog packages
        run: |
          dotnet pack twodog.engine
          dotnet pack twodog.avalonia
          dotnet pack twodog.blazor
          dotnet pack twodog.qt
          dotnet pack twodog.xunit
          dotnet pack twodog.nunit
          dotnet pack twodog.gdunit
          dotnet pack twodog.repl
          dotnet pack twodog
          dotnet pack twodog.templates

      - name: Mount scoped Android input disk
        uses: useblacksmith/stickydisk@3f6be1451e3cad893b778bc93495c80452a5da26 # v1
        with:
          key: ${{ github.repository }}-android-inputs-${{ matrix.precision }}-v1
          path: .ci/android-inputs
          commit: on-change

      - name: Stage scoped Android inputs
        run: uv run --no-project python scripts/stage_android_ci.py stage --precision "$TwoDogPrecision" --identity "$GITHUB_RUN_ID:$GITHUB_SHA"

      - name: Upload scoped Android inputs
        uses: actions/upload-artifact@v7
        with:
          name: android-inputs-${{ matrix.precision }}
          path: |
            .ci/android-inputs/packages/
            .ci/android-inputs/sdk/
            .ci/android-inputs/manifest.json
          if-no-files-found: error
          include-hidden-files: true
          compression-level: 0
          retention-days: 3

      # iOS consumers need the engine dependency closure and fork SDK, not browser/UI packages or raw archives.
      - name: Upload iOS inputs
        uses: actions/upload-artifact@v7
        with:
          name: ios-inputs-${{ matrix.precision }}
          path: |
            packages/2dog.engine*.nupkg
            packages/2dog.godotsharp*.nupkg
            packages/2dog.tools*.nupkg
            packages/2dog.win-x64*.nupkg
            packages/2dog.linux-x64*.nupkg
            packages/2dog.osx-arm64*.nupkg
            packages/2dog.ios-arm64*.nupkg
            packages/2dog.iossimulator-arm64*.nupkg
            godot/bin/GodotSharp/Tools/nupkgs/*.nupkg
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

      - name: Upload godot-bin artifact
        uses: actions/upload-artifact@v7
        with:
          name: godot-bin-${{ matrix.precision }}
          path: |
            godot/bin/
            !godot/bin/**/android/**
            !godot/bin/android/**
            !godot/bin/**/ios/**
            !godot/bin/ios/**
            godot/modules/mono/editor/Godot.NET.Sdk/Godot.SourceGenerators/bin/Release/netstandard2.0/
          retention-days: 3

      - name: Upload NuGet packages
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages-${{ matrix.precision }}
          path: packages/
          compression-level: 0 # nupkg files are already compressed ZIPs
          retention-days: 7

  # Validate the produced packages alongside their consumers, including on revision-only release tags.
  test-binding-packages:
    name: Test Binding Packages (${{ matrix.precision }})
    needs: [check-natives, pack]
    if: >-
      github.repository == 'outfox/2dog' &&
      (!cancelled() && needs.pack.result == 'success')
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        precision: [single, double]
    env:
      TwoDogPrecision: ${{ matrix.precision }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Setup uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: '3.12'
          enable-cache: false

      - name: Download NuGet packages
        uses: actions/download-artifact@v8
        with:
          name: nuget-packages-${{ matrix.precision }}
          path: packages

      - name: Download matching fork SDK
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SUFFIX: ${{ matrix.precision == 'double' && '-double' || '' }}
        run: |
          # Only the SDK is needed from the native release; avoid downloading the large godot-bin artifact.
          gh release download "godot-${{ needs.check-natives.outputs.hash }}${RELEASE_SUFFIX}" \
            --repo "$GITHUB_REPOSITORY" --pattern godotsharp-nupkgs.zip --dir release-assets
          mkdir -p godot/bin/GodotSharp/Tools/nupkgs
          unzip -q release-assets/godotsharp-nupkgs.zip -d godot/bin/GodotSharp/Tools/nupkgs

      - name: Test managed binding packages
        run: uv run tests/bindings/test_packages.py --precision ${{ matrix.precision }}

  # Run tests on each platform, one job per configuration: a single job running all three back to back
  # took 8-10 minutes and hit the job timeout.
  test:
    name: Test (${{ matrix.name }}, ${{ matrix.config }}) [${{ matrix.precision }}]
    needs: [check-natives, pack]
    # Explicit result check: the implicit success() evaluates the transitive
    # needs chain, and the (usually) skipped build-natives job would skip this
    # job too — a green run with zero testing.
    if: >-
      github.repository == 'outfox/2dog' &&
      (!cancelled() && needs.pack.result == 'success' && needs.check-natives.outputs.tested-bump != 'true')
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        precision: [single, double]
        name: [linux-x64, win-x64, osx-arm64]
        config: [Debug, Release, Editor]
        # Linux runs every combination. Windows and macOS run each configuration and each precision at least once;
        # desktop-smoke also boots Release double on all three.
        exclude:
          - name: win-x64
            precision: double
            config: Release
          - name: win-x64
            precision: double
            config: Editor
          - name: osx-arm64
            precision: single
            config: Editor
          - name: osx-arm64
            precision: double
            config: Debug
          - name: osx-arm64
            precision: double
            config: Release
        include:
          - name: linux-x64
            runner: blacksmith-4vcpu-ubuntu-2404
          - name: win-x64
            runner: blacksmith-4vcpu-windows-2025
          - name: osx-arm64
            runner: blacksmith-6vcpu-macos-latest
          # The Debug jobs also run the CLI tool tests and set the workflow's duration. Shorter
          # jobs still finish before them on free GitHub-hosted runners, which take about twice as long.
          - name: linux-x64
            config: Release
            runner: ubuntu-24.04
          - name: linux-x64
            config: Editor
            runner: ubuntu-24.04
          - name: win-x64
            config: Release
            runner: windows-2025
          - name: win-x64
            config: Editor
            runner: windows-2025
          - name: osx-arm64
            config: Editor
            runner: macos-15

    # Each test run gets ten minutes; leave room for setup, the separate coverage/windowed
    # run, and diagnostic uploads without the job cancelling them early.
    timeout-minutes: 30

    env:
      TwoDogPrecision: ${{ matrix.precision }}
      TWODOG_BUILD_SUBDIR: ${{ matrix.precision == 'double' && 'double/' || '' }}
      TWODOG_NATIVE_SUFFIX: ${{ matrix.precision == 'double' && '.double' || '' }}
      TWODOG_RELEASE_SUFFIX: ${{ matrix.precision == 'double' && '-double' || '' }}

    steps:
      # The showcase's LFS assets (e.g. splash.png) must be real files: Godot reports an error for every
      # engine boot that finds an LFS pointer instead, and 2dog.xunit fails tests on Godot errors.
      # demos/showcase links files to templates/; Git for Windows checks symlinks out as text files by default.
      - name: Enable symlinks
        if: runner.os == 'Windows'
        run: git config --global core.symlinks true
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Download native and NuGet inputs concurrently
        uses: ./.github/actions/download-ci-inputs
        with:
          precision: ${{ matrix.precision }}

      # 2dog.tests.slnf excludes showcase.web: its browser-wasm RuntimeIdentifier
      # makes restore demand the (hefty) wasm-tools workload, which only the
      # web-smoke job needs — and installs.
      - name: Restore
        run: dotnet restore 2dog.tests.slnf

      # The watchdog dumps the xunit v3 child (and 2dog.import grandchildren) on a hang;
      # vstest's own --blame-hang only ever dumped its testhost. Crash dumps cover a segv.
      # CLI-only tests run once per OS in Debug single; unmarked native/precision tests stay in both precisions.
      # Windows Debug single's REPL tests run only in the instrumented pass below, with the same filter.
      - name: Test (${{ matrix.config }})
        env:
          TWODOG_TEST_FILTER: >-
            ${{ matrix.config != 'Debug' && 'FullyQualifiedName!~twodog.tests.ToolTests.' ||
            matrix.precision == 'double' && 'Precision!=Independent' ||
            runner.os == 'Windows' && 'FullyQualifiedName!~Repl' || '' }}
        run: bash .github/scripts/test-with-watchdog.sh ${{ matrix.config }}

      - name: Setup uv for REPL coverage
        if: runner.os == 'Windows' && matrix.config == 'Debug' && matrix.precision == 'single'
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: '3.12'
          enable-cache: false

      # Instrument the actual packed assembly, not a special source-project build. 2dog.repl is packed once for
      # every configuration and precision, so one Windows job measures it; behavior runs in every job.
      - name: Require 95% REPL line and branch coverage
        id: repl-coverage
        if: runner.os == 'Windows' && matrix.config == 'Debug' && matrix.precision == 'single'
        timeout-minutes: 10
        shell: bash
        run: |
          uv run --no-project python -m unittest discover -s tests/repl -v
          dotnet test twodog.tests -c ${{ matrix.config }} --no-build --no-restore \
            --filter 'FullyQualifiedName~Repl' --collect:'XPlat Code Coverage' \
            --settings tests/repl/coverage.runsettings \
            --results-directory twodog.tests/TestResults/repl-coverage \
            --logger 'console;verbosity=normal' --blame-hang-timeout 600s
          uv run --no-project python scripts/check_repl_coverage.py twodog.tests/TestResults/repl-coverage

      - name: Upload REPL coverage
        if: always() && steps.repl-coverage.outcome != 'skipped' && runner.os == 'Windows' && matrix.config == 'Debug' && matrix.precision == 'single'
        uses: actions/upload-artifact@v7
        with:
          name: repl-coverage-${{ matrix.config }}-${{ matrix.precision }}
          path: twodog.tests/TestResults/repl-coverage/**/coverage.cobertura.xml
          if-no-files-found: error
          retention-days: 7

      # Windows rendering runs in the windows-rendering job: this runner is a session-0 service without a desktop.
      - name: Test NUnit rendering (Linux)
        if: runner.os == 'Linux' && matrix.config == 'Release'
        timeout-minutes: 10
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          xvfb-run -a dotnet test tests/nunit-rendering -c Release --blame --results-directory tests/nunit-rendering/TestResults

      # The suite above is headless. This starts the stock windowed fixture on the 2dog test thread, as consumers'
      # rendering suites do; AppKit aborts the process when the window server is set up off the main thread.
      - name: Test windowed fixture
        if: runner.os == 'macOS' && matrix.config == 'Release'
        timeout-minutes: 10
        run: |
          results=tests/windowed-fixture/TestResults
          reports="$HOME/Library/Logs/DiagnosticReports"
          started="$RUNNER_TEMP/windowed-fixture.started"
          touch "$started"
          status=0
          dotnet test tests/windowed-fixture -c Release --logger 'console;verbosity=normal' --blame \
            --results-directory "$results" || status=$?
          if [ "$status" -ne 0 ]; then
            # Keep every crash report from this run; ReportCrash may still be writing when the run returns, and a
            # fresh runner may not have the reports directory yet.
            mkdir -p "$results"
            for _ in $(seq 10); do
              if [ -d "$reports" ] && find "$reports" -maxdepth 1 -name '*.ips' -newer "$started" | grep -q .; then
                find "$reports" -maxdepth 1 -name '*.ips' -newer "$started" -exec cp {} "$results/" \;
                break
              fi
              sleep 1
            done
            ls "$results"/*.ips 2>/dev/null || echo "No macOS crash report was written during this run."
          fi
          exit "$status"

      - name: Upload test dumps and blame sequence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-dumps-${{ matrix.name }}-${{ matrix.config }}-${{ matrix.precision }}
          path: '**/TestResults/**'
          if-no-files-found: ignore
          retention-days: 7

  # Adapter contracts have their own process/import/build work; run alongside the main suite.
  # Preserve the previous Debug coverage: both precisions on Linux/Windows, single on macOS.
  test-contracts:
    name: Test Contracts (${{ matrix.name }}, Debug) [${{ matrix.precision }}]
    needs: [check-natives, pack]
    if: >-
      github.repository == 'outfox/2dog' &&
      (!cancelled() && needs.pack.result == 'success' && needs.check-natives.outputs.tested-bump != 'true')
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        precision: [single, double]
        name: [linux-x64, win-x64, osx-arm64]
        exclude:
          - {name: osx-arm64, precision: double}
        include:
          - {name: linux-x64, runner: blacksmith-4vcpu-ubuntu-2404}
          - {name: win-x64, runner: blacksmith-4vcpu-windows-2025}
          - {name: osx-arm64, runner: blacksmith-6vcpu-macos-latest}
    env:
      TwoDogPrecision: ${{ matrix.precision }}
    steps:
      - name: Enable symlinks
        if: runner.os == 'Windows'
        run: git config --global core.symlinks true
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          lfs: true
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Setup uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: '3.12'
          enable-cache: false
      - name: Download native and NuGet inputs concurrently
        uses: ./.github/actions/download-ci-inputs
        with:
          precision: ${{ matrix.precision }}
      - name: Test xUnit, NUnit and GdUnit MTP contracts
        # Includes cold builds/restores now; individual subprocess deadlines remain in the harness.
        timeout-minutes: 10
        run: uv run --no-project python tests/mtp/test_hosts.py --configuration Debug --precision ${{ matrix.precision }}
      - name: Upload MTP contract diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: mtp-contracts-${{ matrix.name }}-Debug-${{ matrix.precision }}
          path: |
            tests/mtp/bin/**/console.log
            tests/mtp/bin/**/fixture.events
            tests/mtp/bin/**/godot/*.log
            tests/gdunit-mtp/bin/contracts/**/*.log
            tests/gdunit-mtp/bin/contracts/**/events.json
            tests/gdunit-mtp/bin/contracts/**/test-name.txt
          if-no-files-found: ignore
          retention-days: 7

  # Blacksmith's Windows runner is an nssm service in session 0, whose window station cannot display
  # windows, so presenting a frame fails there. Windowed rendering needs a runner with an interactive desktop.
  windows-rendering:
    name: Test Rendering (win-x64, Release) [${{ matrix.precision }}]
    needs: [check-natives, pack]
    # See the test job for why this cannot rely on the implicit success().
    if: >-
      github.repository == 'outfox/2dog' &&
      (!cancelled() && needs.pack.result == 'success' && needs.check-natives.outputs.tested-bump != 'true')
    runs-on: windows-2025
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        precision: [single, double]

    env:
      TwoDogPrecision: ${{ matrix.precision }}
      TWODOG_BUILD_SUBDIR: ${{ matrix.precision == 'double' && 'double/' || '' }}
      TWODOG_NATIVE_SUFFIX: ${{ matrix.precision == 'double' && '.double' || '' }}
      TWODOG_RELEASE_SUFFIX: ${{ matrix.precision == 'double' && '-double' || '' }}

    steps:
      # demos/showcase links files to templates/; Git for Windows checks symlinks out as text files by default.
      - name: Enable symlinks
        if: runner.os == 'Windows'
        run: git config --global core.symlinks true
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Download native and NuGet inputs concurrently
        uses: ./.github/actions/download-ci-inputs
        with:
          precision: ${{ matrix.precision }}

      # The test build triggers the automatic Godot import, which runs the in-process import helper.
      - name: Build import helper
        run: dotnet build twodog.import -c Release

      # Windows VMs have no usable OpenGL driver. Render real frames with CPU Vulkan.
      - name: Setup Windows software rendering
        timeout-minutes: 5
        run: .github/scripts/setup-windows-software-rendering.ps1 -RegisterDriver

      - name: Test NUnit rendering
        timeout-minutes: 10
        env:
          TWODOG_GODOT_LOG_DIR: ${{ github.workspace }}/tests/nunit-rendering/TestResults/godot
        run: >-
          dotnet test tests/nunit-rendering -c Release
          --logger 'console;verbosity=normal' --blame-hang-timeout 90s --blame-hang-dump-type full
          --diag tests/nunit-rendering/TestResults/vstest.log
          --results-directory tests/nunit-rendering/TestResults
          -- NUnit.InternalTraceLevel=Debug NUnit.WorkDirectory=${{ github.workspace }}/tests/nunit-rendering/TestResults

      - name: Upload test dumps and logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-dumps-win-x64-rendering-${{ matrix.precision }}
          path: '**/TestResults/**'
          if-no-files-found: ignore
          retention-days: 7

  # Publish the showcase desktop host the way an end user does (Release, RID) and
  # run the result headless. Regression guard: the engine used to load the
  # game assembly only from .godot/mono/temp/bin/Debug, so any Release-only
  # build or publish silently bound no C# script classes (masked in the test
  # jobs by the Debug run that precedes them in the same workspace).
  desktop-smoke:
    name: Desktop Smoke (${{ matrix.name }}) [${{ matrix.precision }}]
    needs: [check-natives, pack]
    # See the test job for why this cannot rely on the implicit success().
    if: >-
      github.repository == 'outfox/2dog' &&
      (!cancelled() && needs.pack.result == 'success' && needs.check-natives.outputs.tested-bump != 'true')
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        precision: [single, double]
        name: [linux-x64, win-x64, osx-arm64]
        # Free GitHub-hosted runners: these jobs finish well before the Debug test jobs.
        include:
          - name: linux-x64
            runner: ubuntu-24.04
            rid: linux-x64
            exe: showcase.2dog
            gdextension: libtwodog_probe.linux.x86_64.so
          - name: win-x64
            runner: windows-2025
            rid: win-x64
            exe: showcase.2dog.exe
            gdextension: twodog_probe.windows.x86_64.dll
          - name: osx-arm64
            runner: macos-15
            rid: osx-arm64
            exe: showcase.2dog
            gdextension: libtwodog_probe.macos.dylib

    timeout-minutes: 15

    env:
      TwoDogPrecision: ${{ matrix.precision }}
      TWODOG_BUILD_SUBDIR: ${{ matrix.precision == 'double' && 'double/' || '' }}
      TWODOG_NATIVE_SUFFIX: ${{ matrix.precision == 'double' && '.double' || '' }}
      TWODOG_RELEASE_SUFFIX: ${{ matrix.precision == 'double' && '-double' || '' }}
      # Release hosts are WinExe: a host startup error would otherwise block on a message box until the job times out.
      DOTNET_DISABLE_GUI_ERRORS: '1'

    steps:
      # demos/showcase links files to templates/; Git for Windows checks symlinks out as text files by default.
      - name: Enable symlinks
        if: runner.os == 'Windows'
        run: git config --global core.symlinks true
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Download native and NuGet inputs concurrently
        uses: ./.github/actions/download-ci-inputs
        with:
          precision: ${{ matrix.precision }}

      # The publish triggers the automatic Godot import, which runs the
      # in-process import helper (discovered at twodog.import/bin/Release in
      # source checkouts).
      - name: Build import helper
        run: dotnet build twodog.import -c Release

      # Desktop hosts publish self-contained by default (PublishSelfContained
      # in the host csproj). Also guards the second-runtime interop crash:
      # self-contained hosts must not reach gd_mono's hostfxr fallback.
      - name: Publish showcase desktop host (Release, RID)
        run: dotnet publish demos/showcase/showcase.2dog -c Release -r ${{ matrix.rid }}

      - name: Boot showcase in editor mode
        shell: bash
        run: |
          # Wait for the editor's initial scan before quitting; a fixed frame
          # count can interrupt the scan and report a native warning on Linux.
          dotnet run --project demos/showcase/showcase.2dog -c Editor -- \
            --headless --editor --import -- --2dog-smoke-markers > editor-smoke.log 2>&1
          cat editor-smoke.log
          grep -q '2DOG_EDITOR_SMOKE_PASSED' editor-smoke.log
          if grep -Eq '2DOG_(CSHARP_SCRIPT|API)_SMOKE_PASSED|^ERROR:|^WARNING:' editor-smoke.log; then
            exit 1
          fi

      - name: Verify WebGPU capability rejections
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # Rejection happens before creating a display or GPU device.
          METHOD=forward_plus
          REASON='WebGPU currently supports only the Mobile rendering method'
          if [ '${{ matrix.precision }}' = double ]; then
            METHOD=mobile
            REASON='WebGPU is unavailable in double-precision runtimes'
          fi
          if dotnet run --project tests/webgpu-smoke -c Release -- webgpu "$METHOD" --startup-only > webgpu-rejection.log 2>&1; then
            cat webgpu-rejection.log
            echo 'Unsupported WebGPU startup unexpectedly succeeded'
            exit 1
          fi
          cat webgpu-rejection.log
          grep -q "$REASON" webgpu-rejection.log
          if [ '${{ matrix.precision }}' = double ]; then
            if dotnet run --project tests/webgpu-smoke -c Release -- webgpu mobile --startup-only --project-settings > webgpu-project-rejection.log 2>&1; then
              cat webgpu-project-rejection.log
              exit 1
            fi
            cat webgpu-project-rejection.log
            grep -q "$REASON" webgpu-project-rejection.log
          fi
          dotnet run --project tests/webgpu-smoke -c Release -- webgpu "$METHOD" --startup-only --headless --project-settings > webgpu-headless.log 2>&1
          cat webgpu-headless.log
          grep -q NATIVE_RENDERER_STARTUP_PASSED webgpu-headless.log
          if grep -Eq '^ERROR:|^WARNING:' webgpu-headless.log; then exit 1; fi

      - name: Check C# editor hot-reload lifecycle
        shell: bash
        run: |
          dotnet run --project tests/editor-lifecycle-smoke -c Editor > editor-lifecycle-smoke.log 2>&1
          cat editor-lifecycle-smoke.log
          grep -q 'NATIVE_EDITOR_LIFECYCLE_SMOKE_PASSED' editor-lifecycle-smoke.log
          if grep -Eq '^ERROR:|^WARNING:' editor-lifecycle-smoke.log; then
            exit 1
          fi

      # RID-less publish is the most natural user command: the SDK infers the
      # host RID for the self-contained default and publishes through an inner
      # RID build. Own output dir - the default output is the same RID
      # directory as the explicit-RID publish above.
      - name: Publish showcase desktop host (Release, no RID)
        run: >-
          dotnet publish demos/showcase/showcase.2dog -c Release
          -o demos/showcase/showcase.2dog/bin/${{ env.TWODOG_BUILD_SUBDIR }}Release/net10.0/publish-norid

      # Framework-dependent opt-out: the only publish that stays truly RID-less,
      # so it takes the host-OS gated native-copy path in the platform targets
      # (instead of RID gated) and boots through the machine-wide runtime.
      - name: Publish showcase desktop host (Release, framework-dependent)
        run: >-
          dotnet publish demos/showcase/showcase.2dog -c Release
          -p:PublishSelfContained=false
          -o demos/showcase/showcase.2dog/bin/${{ env.TWODOG_BUILD_SUBDIR }}Release/net10.0/publish-fdd

      # ReadyToRun precompiles GodotSharp, twodog and the host for faster startup; the JIT stays available.
      - name: Publish showcase desktop host (Release, ReadyToRun)
        run: >-
          dotnet publish demos/showcase/showcase.2dog -c Release -r ${{ matrix.rid }}
          -p:PublishReadyToRun=true
          -o demos/showcase/showcase.2dog/bin/${{ env.TWODOG_BUILD_SUBDIR }}Release/net10.0/publish-r2r

      # Startup hook that counts GodotSharp and twodog methods run from R2R code: the runtime ignores R2R code
      # for some load paths, so precompiled files alone do not prove it is used.
      - name: Build ReadyToRun probe
        shell: bash
        run: |
          dotnet build tests/ready-to-run -c Release
          probe="$PWD/tests/ready-to-run/bin/${{ env.TWODOG_BUILD_SUBDIR }}Release/net10.0/ReadyToRunProbe.dll"
          if [ "$RUNNER_OS" = "Windows" ]; then probe="$(cygpath -w "$probe")"; fi
          echo "R2R_PROBE=$probe" >> "$GITHUB_ENV"

      # NativeAOT links ILC output with the platform toolchain (clang + zlib on
      # Linux); install them only when the runner image lacks them.
      - name: Install NativeAOT prerequisites (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          if ! command -v clang > /dev/null || ! dpkg -s zlib1g-dev > /dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y clang zlib1g-dev
          fi

      # NativeAOT: one native executable without a .NET runtime, GodotPlugins
      # or game assembly on disk; twodog initializes GodotSharp through its
      # built-in plugins entry point. Warnings fail the step: ILC reports the
      # reflection and assembly-location uses that break at runtime.
      - name: Publish showcase desktop host (Release, NativeAOT)
        run: >-
          dotnet publish demos/showcase/showcase.2dog -c Release -r ${{ matrix.rid }}
          -p:PublishAot=true -p:TrimmerSingleWarn=false -warnaserror
          -o demos/showcase/showcase.2dog/bin/${{ env.TWODOG_BUILD_SUBDIR }}Release/net10.0/publish-aot

      - name: Test delegate serialization (JIT and NativeAOT)
        shell: bash
        run: |
          NATIVE=$(find demos/showcase/showcase.2dog/bin/${{ env.TWODOG_BUILD_SUBDIR }}Release/net10.0/publish-aot \
            -maxdepth 1 -type f -name 'libgodot-release.*' -print -quit)
          if [ -z "$NATIVE" ]; then
            echo "::error::Release libgodot library missing from the NativeAOT publish"
            exit 1
          fi
          dotnet publish tests/bindings/delegate-serialization -c Release -r ${{ matrix.rid }} \
            -warnaserror -o artifacts/delegate-serialization-jit
          dotnet artifacts/delegate-serialization-jit/DelegateSerialization.dll "$NATIVE"
          dotnet publish tests/bindings/delegate-serialization -c Release -r ${{ matrix.rid }} \
            -p:PublishAot=true -warnaserror -o artifacts/delegate-serialization-aot
          EXE=artifacts/delegate-serialization-aot/DelegateSerialization
          if [ "$RUNNER_OS" = "Windows" ]; then EXE="$EXE.exe"; fi
          "$EXE" "$NATIVE"

      # Desktop publishes must export the game content as an exe-adjacent
      # pck; the published host then boots from it (Engine.ResolveContent()
      # returns null when the pck is present). Issue #43 regression guard.
      # The pack export also copies the showcase's GDExtension library beside
      # it, where Godot looks once res:// is the pack - and nothing else: the
      # C# export plugin's own publish once leaked a .NET runtime (hostfxr)
      # there, turning the framework-dependent host into a broken
      # self-contained one.
      - name: Verify exported pck
        shell: bash
        run: |
          fdd=demos/showcase/showcase.2dog/bin/${{ env.TWODOG_BUILD_SUBDIR }}Release/net10.0/publish-fdd
          aot=demos/showcase/showcase.2dog/bin/${{ env.TWODOG_BUILD_SUBDIR }}Release/net10.0/publish-aot
          for dir in \
            "demos/showcase/showcase.2dog/bin/${{ env.TWODOG_BUILD_SUBDIR }}Release/net10.0/${{ matrix.rid }}/publish" \
            "demos/showcase/showcase.2dog/bin/${{ env.TWODOG_BUILD_SUBDIR }}Release/net10.0/publish-norid" \
            "demos/showcase/showcase.2dog/bin/${{ env.TWODOG_BUILD_SUBDIR }}Release/net10.0/publish-r2r" \
            "$fdd" "$aot"; do
            if [ ! -f "$dir/showcase.2dog.pck" ]; then
              echo "::error::Missing $dir/showcase.2dog.pck - the desktop publish did not export the game pck"
              exit 1
            fi
            if [ ! -f "$dir/${{ matrix.gdextension }}" ]; then
              echo "::error::Missing $dir/${{ matrix.gdextension }} - the pack export did not copy the GDExtension library"
              exit 1
            fi
            if ls -d "$dir"/data_* > /dev/null 2>&1; then
              echo "::error::$dir contains Godot export data directories - the pack export copied C# build outputs"
              exit 1
            fi
          done
          if ls "$fdd" | grep -qi hostfxr; then
            echo "::error::The framework-dependent publish contains a .NET host (hostfxr) - the pack export leaked a runtime"
            exit 1
          fi
          # Everything managed is compiled into the NativeAOT executable.
          for managed in GodotPlugins.dll GodotSharp.dll twodog.dll showcase.dll; do
            if [ -f "$aot/$managed" ]; then
              echo "::error::The NativeAOT publish contains $managed - managed assemblies must be compiled in"
              exit 1
            fi
          done

      # The engine must load the game assembly from the publish output itself.
      # Delete the game project's own build outputs so a regression back to
      # .godot/mono/temp/bin probing cannot be masked by them.
      - name: Remove game project build outputs
        shell: bash
        run: rm -rf demos/showcase/.godot/mono/temp/bin

      # Scene probes always run; opt into their success markers for the log assertions below.
      # The ReadyToRun probe also runs here, as the control that reports no R2R code.
      - name: Run published host (headless, RID)
        id: run
        shell: bash
        run: |
          set +e
          DOTNET_STARTUP_HOOKS="$R2R_PROBE" \
            demos/showcase/showcase.2dog/bin/${{ env.TWODOG_BUILD_SUBDIR }}Release/net10.0/${{ matrix.rid }}/publish/${{ matrix.exe }} \
            --headless --quit-after 120 -- --2dog-smoke-markers 2>&1 | tee smoke.log
          status=${PIPESTATUS[0]}
          echo "Host exit code: $status"
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: Run published host (headless, no RID)
        id: run_norid
        shell: bash
        run: |
          set +e
          demos/showcase/showcase.2dog/bin/${{ env.TWODOG_BUILD_SUBDIR }}Release/net10.0/publish-norid/${{ matrix.exe }} \
            --headless --quit-after 120 -- --2dog-smoke-markers 2>&1 | tee smoke-norid.log
          status=${PIPESTATUS[0]}
          echo "Host exit code: $status"
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: Run published host (headless, framework-dependent)
        id: run_fdd
        shell: bash
        run: |
          set +e
          demos/showcase/showcase.2dog/bin/${{ env.TWODOG_BUILD_SUBDIR }}Release/net10.0/publish-fdd/${{ matrix.exe }} \
            --headless --quit-after 120 -- --2dog-smoke-markers 2>&1 | tee smoke-fdd.log
          status=${PIPESTATUS[0]}
          echo "Host exit code: $status"
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: Run published host (headless, ReadyToRun)
        id: run_r2r
        shell: bash
        run: |
          set +e
          DOTNET_STARTUP_HOOKS="$R2R_PROBE" \
            demos/showcase/showcase.2dog/bin/${{ env.TWODOG_BUILD_SUBDIR }}Release/net10.0/publish-r2r/${{ matrix.exe }} \
            --headless --quit-after 120 -- --2dog-smoke-markers 2>&1 | tee smoke-r2r.log
          status=${PIPESTATUS[0]}
          echo "Host exit code: $status"
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: Run published host (headless, NativeAOT)
        id: run_aot
        shell: bash
        run: |
          set +e
          demos/showcase/showcase.2dog/bin/${{ env.TWODOG_BUILD_SUBDIR }}Release/net10.0/publish-aot/${{ matrix.exe }} \
            --headless --quit-after 120 -- --2dog-smoke-markers 2>&1 | tee smoke-aot.log
          status=${PIPESTATUS[0]}
          echo "Host exit code: $status"
          echo "status=$status" >> "$GITHUB_OUTPUT"

      # Surface the .ips crash report for the known macOS teardown abort
      # (libgodot exit-time static destructors; see the twodog.Engine static
      # ctor comment) so it can be root-caused in the fork.
      - name: Dump crash report (macOS)
        if: runner.os == 'macOS' && (steps.run.outputs.status != '0' || steps.run_norid.outputs.status != '0' || steps.run_fdd.outputs.status != '0' || steps.run_r2r.outputs.status != '0' || steps.run_aot.outputs.status != '0')
        shell: bash
        run: |
          # ReportCrash writes the .ips shortly after the abort
          for i in $(seq 1 12); do
            ls ~/Library/Logs/DiagnosticReports/showcase.2dog-*.ips > /dev/null 2>&1 && break
            sleep 5
          done
          cat ~/Library/Logs/DiagnosticReports/showcase.2dog-*.ips 2>/dev/null \
            || echo "no crash report found"

      # Deterministic backtrace: rerun the aborting binary under lldb and dump
      # all threads at the abort. This is the data source for fixing the
      # teardown crash in the fork.
      - name: Rerun under lldb for backtrace (macOS)
        if: runner.os == 'macOS' && (steps.run.outputs.status != '0' || steps.run_norid.outputs.status != '0' || steps.run_fdd.outputs.status != '0' || steps.run_r2r.outputs.status != '0' || steps.run_aot.outputs.status != '0')
        shell: bash
        run: |
          publish=demos/showcase/showcase.2dog/bin/${{ env.TWODOG_BUILD_SUBDIR }}Release/net10.0/${{ matrix.rid }}/publish
          if [ "${{ steps.run_r2r.outputs.status }}" != "0" ]; then
            publish=demos/showcase/showcase.2dog/bin/${{ env.TWODOG_BUILD_SUBDIR }}Release/net10.0/publish-r2r
          fi
          if [ "${{ steps.run_aot.outputs.status }}" != "0" ]; then
            publish=demos/showcase/showcase.2dog/bin/${{ env.TWODOG_BUILD_SUBDIR }}Release/net10.0/publish-aot
          fi
          lldb -b \
            -o run \
            -o "bt all" \
            -o quit \
            -- "$publish/${{ matrix.exe }}" \
               --headless --quit-after 120 -- --2dog-smoke-markers 2>&1 | tail -150 || true

      - name: Assert scripts bound
        shell: bash
        run: |
          fail=0
          check() {
            local log="$1" status="$2" label="$3"
            if grep -q "Cannot instantiate C# script" "$log"; then
              echo "::error::[$label] The published host could not bind C# script classes"
              fail=1
            fi
            if ! grep -q "2DOG_CSHARP_SCRIPT_SMOKE_PASSED" "$log"; then
              echo "::error::[$label] C# script smoke marker missing (SpinningCube did not bind)"
              fail=1
            fi
            if ! grep -q "2DOG_GDSCRIPT_LINKER_SMOKE_PASSED" "$log"; then
              echo "::error::[$label] GDScript linker smoke marker missing"
              fail=1
            fi
            if ! grep -q "2DOG_GDEXTENSION_SMOKE_PASSED" "$log"; then
              echo "::error::[$label] GDExtension smoke marker missing (the probe extension did not load)"
              fail=1
            fi
            if ! grep -q "2DOG_API_SMOKE_PASSED" "$log"; then
              echo "::error::[$label] GodotSharp API smoke marker missing (GodotApiSmoke.RunAll failed)"
              fail=1
            fi
            if [ "$status" != "0" ]; then
              echo "::error::[$label] Host exited with code $status"
              fail=1
            fi
          }
          check smoke.log "${{ steps.run.outputs.status }}" "rid"
          check smoke-norid.log "${{ steps.run_norid.outputs.status }}" "no-rid"
          check smoke-fdd.log "${{ steps.run_fdd.outputs.status }}" "framework-dependent"
          check smoke-r2r.log "${{ steps.run_r2r.outputs.status }}" "readytorun"
          check smoke-aot.log "${{ steps.run_aot.outputs.status }}" "nativeaot"

          # The R2R host must run GodotSharp and twodog from precompiled code; the plain RID host, as the control,
          # proves the probe reports R2R use rather than any call.
          r2r=$(grep -o "2DOG_R2R_PROBE godotsharp=[0-9]* twodog=[0-9]*" smoke-r2r.log)
          control=$(grep -o "2DOG_R2R_PROBE godotsharp=[0-9]* twodog=[0-9]*" smoke.log)
          echo "readytorun: $r2r"
          echo "control: $control"
          if ! echo "$r2r" | grep -Eq "godotsharp=[1-9][0-9]* twodog=[1-9][0-9]*$"; then
            echo "::error::[readytorun] GodotSharp or twodog methods did not run ReadyToRun code: ${r2r:-probe output missing}"
            fail=1
          fi
          if [ "$control" != "2DOG_R2R_PROBE godotsharp=0 twodog=0" ]; then
            echo "::error::[rid] The ReadyToRun probe control did not report zero R2R methods: ${control:-probe output missing}"
            fail=1
          fi
          exit $fail

  # Exercise packaged Dawn once per native platform, separately from the normal desktop lifecycle.
  webgpu-desktop:
    name: WebGPU Desktop (${{ matrix.name }})
    needs: [check-natives, pack]
    if: >-
      github.repository == 'outfox/2dog' &&
      (!cancelled() && needs.pack.result == 'success' && needs.check-natives.outputs.tested-bump != 'true')
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            runner: blacksmith-4vcpu-ubuntu-2404
          - name: win-x64
            runner: windows-2025
          - name: osx-arm64
            runner: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Download NuGet packages
        uses: actions/download-artifact@v8
        with:
          name: nuget-packages-single
          path: packages

      - name: Build packaged WebGPU smoke host
        shell: bash
        run: |
          # This host consumes packages only; the other local NuGet source may be empty.
          mkdir -p godot/bin/GodotSharp/Tools/nupkgs
          dotnet build tests/webgpu-smoke -c Release

      - name: Install display dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb mesa-vulkan-drivers libvulkan1

      - name: Render and restart WebGPU Mobile
        shell: bash
        run: |
          SMOKE=tests/webgpu-smoke/bin/Release/net10.0/NativeWebGpuSmoke
          status=0
          if [ "$RUNNER_OS" = Linux ]; then
            cc -shared -fPIC .github/scripts/native-abort-trace.c -o /tmp/2dog-native-abort-trace.so
            xvfb-run -a env LD_PRELOAD=/tmp/2dog-native-abort-trace.so "$SMOKE" webgpu mobile > webgpu-smoke.log 2>&1 || status=$?
          elif [ "$RUNNER_OS" = macOS ]; then
            lldb --batch --no-lldbinit -o 'settings set auto-confirm true' \
              -o run -k 'thread backtrace all' -k 'quit 1' \
              -- "$SMOKE" webgpu mobile > webgpu-smoke.log 2>&1 &
            smoke_pid=$!
            (sleep 300; kill -TERM "$smoke_pid" 2>/dev/null; sleep 5; kill -KILL "$smoke_pid" 2>/dev/null) &
            watchdog_pid=$!
            wait "$smoke_pid" || status=$?
            kill "$watchdog_pid" 2>/dev/null || true
            grep -q 'exited with status = 0 ' webgpu-smoke.log || status=1
          else
            "$SMOKE.exe" webgpu mobile > webgpu-smoke.log 2>&1 || status=$?
          fi
          cat webgpu-smoke.log
          [ "$status" -eq 0 ]
          grep -q 'NATIVE_WEBGPU_SMOKE_PASSED: lifetime 2' webgpu-smoke.log
          if grep -Eq '^ERROR:|^WARNING:' webgpu-smoke.log; then exit 1; fi

      - name: Verify default selection and unsupported shader contracts
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a dotnet run --project tests/webgpu-smoke -c Release --no-build -- webgpu default --startup-only
            xvfb-run -a dotnet run --project tests/webgpu-smoke -c Release --no-build -- webgpu mobile --contract-rejections
          else
            dotnet run --project tests/webgpu-smoke -c Release --no-build -- webgpu default --startup-only
            dotnet run --project tests/webgpu-smoke -c Release --no-build -- webgpu mobile --contract-rejections
          fi

      - name: Preserve WebGPU desktop diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: webgpu-desktop-${{ matrix.name }}
          path: |
            webgpu-smoke.log
            ~/Library/Logs/DiagnosticReports/*NativeWebGpu*.ips
          if-no-files-found: ignore
          retention-days: 7

  # Publish the web showcase end-to-end: statically links the web libgodot.a into
  # dotnet.native.wasm via the wasm-tools workload and asserts the app bundle
  # is complete. Consumers never install emsdk — the workload ships the
  # matching emscripten (see <EmscriptenVersion> in Directory.Build.props).
  web-smoke:
    name: Web Smoke (${{ matrix.flavor }}, AOT=${{ matrix.aot }}) [${{ matrix.precision }}]
    needs: [pack]
    # See the test job for why this cannot rely on the implicit success().
    if: github.repository == 'outfox/2dog' && (!cancelled() && needs.pack.result == 'success')
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        flavor: [web, webxr, webmt, blazor]
        precision: [single, double]
        # AOT is the slowest smoke build; keep it as a release gate for both
        # pushed v* tags and release.yml's workflow_dispatch on the new tag.
        aot: ${{ fromJSON((startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/double-precision') && '[false, true]' || '[false]') }}
        # Contracts and exception diagnostics run once, independently of the app publishes.
        include:
          - {flavor: checks, precision: single, aot: false}

    env:
      TwoDogPrecision: ${{ matrix.precision }}
      TWODOG_BUILD_SUBDIR: ${{ matrix.precision == 'double' && 'double/' || '' }}
      TWODOG_NATIVE_SUFFIX: ${{ matrix.precision == 'double' && '.double' || '' }}
      TWODOG_RELEASE_SUFFIX: ${{ matrix.precision == 'double' && '-double' || '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Setup uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: '3.12'
          enable-cache: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install wasm-tools workload
        run: dotnet workload install wasm-tools --skip-manifest-update --source https://api.nuget.org/v3/index.json

      - name: Verify MSBuild configuration defaults
        if: matrix.flavor == 'checks'
        env:
          TwoDogPrecision: ''
        run: uv run python -m unittest discover -s tests/msbuild -v

      - name: Download native and NuGet inputs concurrently
        uses: ./.github/actions/download-ci-inputs
        with:
          precision: ${{ matrix.precision }}

      - name: Make Linux editor executable
        if: matrix.flavor != 'checks'
        run: chmod +x godot/bin/godot.linuxbsd.editor${{ env.TWODOG_NATIVE_SUFFIX }}.x86_64.executable.mono

      # The publish exports the showcase Godot project as godot.pck via the
      # in-process import helper, discovered at twodog.import/bin/Release in
      # source checkouts (twodog.engine/build/2dog.engine.targets). Must come after the
      # godot-bin download: the helper references GodotSharp assemblies from
      # godot/bin.
      - name: Build import helper
        if: matrix.flavor != 'checks'
        run: dotnet build twodog.import -c Release

      # Double precision and threaded runtimes do not support WebGPU. These portable
      # smoke cells use Compatibility; dedicated image and Blazor restart tests cover WebGPU.
      - name: Select Compatibility for portable browser smoke
        if: matrix.flavor != 'checks'
        run: |
          uv run python - <<'PY'
          from pathlib import Path
          project = Path('demos/showcase/project.godot')
          content = project.read_text()
          setting = 'renderer/rendering_method.web="mobile"'
          assert content.count(setting) == 1, 'Showcase web renderer setting changed'
          project.write_text(content.replace(setting, 'renderer/rendering_method.web="gl_compatibility"'))
          PY

      # Keep the documented from-root publish flow under the root SDK pin.
      - name: Publish showcase.${{ matrix.flavor }}
        if: matrix.flavor != 'checks'
        run: dotnet publish demos/showcase/showcase.${{ matrix.flavor }} -c Release -p:RunAOTCompilation=${{ matrix.aot }}

      - name: Verify app bundle
        if: matrix.flavor == 'web' || matrix.flavor == 'webmt'
        run: |
          BUNDLE=demos/showcase/showcase.${{ matrix.flavor }}/AppBundle
          # The last four dotnet.* files back the shell's modulepreload hints;
          # a rename there would 404 on every page load while CI stays green.
          for f in "$BUNDLE/godot.wasm" "$BUNDLE/godot.pck" "$BUNDLE/godot.js" "$BUNDLE/index.html" \
                   "$BUNDLE/twodog.sizes.json" "$BUNDLE/godot.wasm.br" "$BUNDLE/godot.wasm.gz" "$BUNDLE/godot.pck.gz" \
                   "$BUNDLE/_framework/dotnet.js" "$BUNDLE/_framework/dotnet.boot.js" \
                   "$BUNDLE/_framework/dotnet.runtime.js" "$BUNDLE/_framework/dotnet.native.js"; do
            if [ ! -f "$f" ]; then
              echo "::error::Missing $f in the published app bundle"
              ls -R "$BUNDLE" || true
              exit 1
            fi
          done
          # Debug-only weight must stay out of release bundles: the symbol map
          # alone is ~20 MB and dotnet.js downloads it at every boot. Scoped to
          # _framework, matching the TwoDogWebStripMaps delete (user wwwroot
          # content is not ours to police).
          STRAYS=$(find "$BUNDLE/_framework" -name '*.symbols' -o -name '*.js.map')
          if [ -n "$STRAYS" ]; then
            echo "::error::Debug artifacts leaked into the release bundle: $STRAYS"
            exit 1
          fi
          # godot.wasm contains the statically linked engine — sanity floor.
          SIZE=$(stat -c%s "$BUNDLE/godot.wasm")
          echo "godot.wasm size: $SIZE bytes"
          if [ "$SIZE" -lt 20000000 ]; then
            echo "::error::godot.wasm is suspiciously small ($SIZE bytes) — engine may be missing from the link"
            exit 1
          fi
          echo "Web app bundle OK"

      - name: Verify webxr app bundle
        if: matrix.flavor == 'webxr'
        run: |
          BUNDLE=demos/showcase/showcase.webxr/AppBundle
          # Same shape as the web bundle (same asset list, including the
          # preload/size-manifest/precompression files the shell references),
          # plus the vendored Layers polyfill loaded before godot.js.
          for f in "$BUNDLE/godot.wasm" "$BUNDLE/godot.pck" "$BUNDLE/godot.js" "$BUNDLE/index.html" \
                   "$BUNDLE/twodog.sizes.json" "$BUNDLE/godot.wasm.br" "$BUNDLE/godot.wasm.gz" "$BUNDLE/godot.pck.gz" \
                   "$BUNDLE/webxr-layers-polyfill.min.js" \
                   "$BUNDLE/_framework/dotnet.js" "$BUNDLE/_framework/dotnet.boot.js" \
                   "$BUNDLE/_framework/dotnet.runtime.js" "$BUNDLE/_framework/dotnet.native.js"; do
            if [ ! -f "$f" ]; then
              echo "::error::Missing $f in the published webxr app bundle"
              ls -R "$BUNDLE" || true
              exit 1
            fi
          done
          STRAYS=$(find "$BUNDLE/_framework" -name '*.symbols' -o -name '*.js.map')
          if [ -n "$STRAYS" ]; then
            echo "::error::Debug artifacts leaked into the release webxr bundle: $STRAYS"
            exit 1
          fi
          if ! grep -q 'webxr-layers-polyfill.min.js' "$BUNDLE/index.html"; then
            echo "::error::The webxr shell does not reference the Layers polyfill"
            exit 1
          fi
          echo "WebXR app bundle OK"

      - name: Verify blazor publish
        if: matrix.flavor == 'blazor'
        run: |
          PUB=demos/showcase/showcase.blazor/bin/${{ env.TWODOG_BUILD_SUBDIR }}Release/net10.0/publish
          WWW=$PUB/wwwroot
          # Blazor fingerprints its framework files; match by pattern.
          for pattern in "$PUB/showcase.blazor.dll" "$WWW/godot.pck" "$WWW/godot.audio.worklet.js" \
                         "$WWW/godot.audio.position.worklet.js" "$WWW/_content/2dog.blazor/2dog.blazor.js" \
                         "$WWW/_framework/blazor.web*.js" "$WWW/_framework/dotnet.native*.wasm"; do
            if ! ls $pattern > /dev/null 2>&1; then
              echo "::error::Missing $pattern in the published blazor host"
              ls -R "$PUB" || true
              exit 1
            fi
          done
          # No plain-shell leftovers: the Blazor SDK owns the bundle.
          if [ -e "$WWW/godot.wasm" ] || [ -e "$WWW/godot.js" ] || [ -d demos/showcase/showcase.blazor/Client/AppBundle ]; then
            echo "::error::The blazor client produced plain-shell artifacts (godot.wasm/godot.js/AppBundle)"
            exit 1
          fi
          # The engine is linked into Blazor's runtime - sanity floor on the largest dotnet.native wasm.
          SIZE=$(ls -S $WWW/_framework/dotnet.native*.wasm | head -1 | xargs stat -c%s)
          echo "dotnet.native.wasm size: $SIZE bytes"
          if [ "$SIZE" -lt 20000000 ]; then
            echo "::error::dotnet.native.wasm is suspiciously small ($SIZE bytes) - engine may be missing from the link"
            exit 1
          fi
          echo "Blazor publish OK"

      # Execute the linked app in a real browser. The game assembly runs the
      # shared GodotApiSmoke probe and marks the DOM only after native API,
      # resource, codec, server, scene, generated C# script, GDScript-only
      # engine-module and GDExtension side module (loaded from the pck) calls
      # succeed. The webxr flavor additionally asserts the
      # WebXR interface is registered on XRServer (its Program.cs does); webmt
      # calls the GDExtension probe from worker threads.
      - name: Run browser API smoke
        if: matrix.flavor == 'web' || matrix.flavor == 'webxr' || matrix.flavor == 'webmt'
        run: |
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)
          if [ -z "$CHROME" ]; then
            echo "::error::No Chrome/Chromium executable is available on the runner"
            exit 1
          fi

          cleanup() {
            if [ -n "${CHROME_PID:-}" ]; then
              kill "$CHROME_PID" 2>/dev/null || true
            fi
            if [ -n "${SERVER_PID:-}" ]; then
              kill "$SERVER_PID" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT

          FLAVOR=${{ matrix.flavor }}
          BUNDLE=demos/showcase/showcase.$FLAVOR/AppBundle

          # Opt in to deliberate error/warning interop probes only in CI.
          uv run python - "$BUNDLE/index.html" <<'PY'
          from pathlib import Path
          import sys
          path = Path(sys.argv[1])
          content = path.read_text()
          needle = "'args': []"
          assert content.count(needle) == 1, "Showcase shell args declaration changed"
          path.write_text(content.replace(needle, "'args': ['--', '--2dog-smoke-markers']"))
          PY

          # The webxr shell records whether Layers polyfill construction
          # completed; require it, so a polyfill that throws during init
          # cannot ride the generic smoke marker to a pass.
          EXTRA_ATTR=""
          if [ "$FLAVOR" = "webxr" ]; then
            EXTRA_ATTR="data-twodog-xr-layers=polyfilled"
          fi

          if [ "$FLAVOR" = "webmt" ]; then
            # SharedArrayBuffer, and so the threaded runtime, needs cross-origin isolation.
            node .github/scripts/serve-isolated.mjs "$BUNDLE" 8000 > /tmp/2dog-web-server.log 2>&1 &
          else
            uv run python -m http.server 8000 --bind 127.0.0.1 --directory "$BUNDLE" > /tmp/2dog-web-server.log 2>&1 &
          fi
          SERVER_PID=$!

          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/index.html > /dev/null; then
              break
            fi
            sleep 1
          done

          "$CHROME" \
            --headless=new \
            --no-sandbox \
            --use-gl=angle \
            --use-angle=swiftshader-webgl \
            --enable-unsafe-swiftshader \
            --disable-dev-shm-usage \
            --enable-logging=stderr \
            --remote-debugging-address=127.0.0.1 \
            --remote-debugging-port=9222 \
            '--remote-allow-origins=*' \
            "--user-data-dir=${RUNNER_TEMP}/2dog-chrome-$FLAVOR" \
            http://127.0.0.1:8000/index.html \
            > /tmp/2dog-browser.log 2>&1 &
          CHROME_PID=$!

          set +e
          timeout 130s node .github/scripts/wait-for-browser-smoke.mjs \
            http://127.0.0.1:8000/index.html 120000 9222 $EXTRA_ATTR
          SMOKE_STATUS=$?
          set -e

          cat /tmp/2dog-web-server.log
          cat /tmp/2dog-browser.log

          if [ "$SMOKE_STATUS" -ne 0 ]; then
            echo "::error::The $FLAVOR browser app did not complete the Godot API smoke probe"
            exit "$SMOKE_STATUS"
          fi
          echo "$FLAVOR browser smoke passed"

      - name: Test browser lifetime cleanup and Blazor preparation cancellation
        if: matrix.flavor == 'checks'
        env:
          GODOT_WEB_JS_LIB_DIR: godot/bin/${{ env.TWODOG_BUILD_SUBDIR }}web/template_release/libgodot/js_library
        run: node --test .github/scripts/blazor-lifetime.test.mjs .github/scripts/godot-web-lifetime.test.mjs .github/scripts/web-side-module-exports.test.mjs .github/scripts/web-renderer-default.test.mjs .github/scripts/web-exception-diagnostics.test.mjs

      - name: Test managed exception reporting in browser-wasm
        if: matrix.flavor == 'checks'
        run: |
          dotnet publish tests/browser-exceptions -c Release -r browser-wasm --configfile nuget.config \
            -p:WasmAppDir="$PWD/browser-exceptions-probe" -v:quiet
          uv run python -m http.server 8091 --bind 127.0.0.1 --directory browser-exceptions-probe > /tmp/2dog-exceptions-server.log 2>&1 &
          SERVER_PID=$!
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage \
            --remote-debugging-port=9231 --user-data-dir=/tmp/2dog-exceptions-chrome \
            http://127.0.0.1:8091/index.html > /tmp/2dog-exceptions-chrome.log 2>&1 &
          CHROME_PID=$!
          trap 'kill "$CHROME_PID" "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:9231/json/list > /dev/null; then break; fi
            sleep 1
          done
          node .github/scripts/web-exception-diagnostics-smoke.mjs http://127.0.0.1:8091/index.html 9231

      # Same API probe through the published ASP.NET Core server and Blazor client.
      - name: Run Blazor browser smoke
        if: matrix.flavor == 'blazor'
        run: |
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)
          cleanup() {
            if [ -n "${CHROME_PID:-}" ]; then kill "$CHROME_PID" 2>/dev/null || true; fi
            if [ -n "${SERVER_PID:-}" ]; then kill "$SERVER_PID" 2>/dev/null || true; fi
          }
          trap cleanup EXIT

          PUB=demos/showcase/showcase.blazor/bin/${{ env.TWODOG_BUILD_SUBDIR }}Release/net10.0/publish
          # The content root must be the publish folder: static web assets resolve relative to it.
          ASPNETCORE_ENVIRONMENT=Production dotnet "$PUB/showcase.blazor.dll" --urls http://127.0.0.1:8000 \
            --contentroot "$(pwd)/$PUB" > /tmp/2dog-blazor-server.log 2>&1 &
          SERVER_PID=$!

          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8000/ > /dev/null; then
              break
            fi
            sleep 1
          done

          "$CHROME" \
            --headless=new \
            --no-sandbox \
            --use-gl=angle \
            --use-angle=swiftshader-webgl \
            --enable-unsafe-swiftshader \
            --disable-dev-shm-usage \
            --enable-logging=stderr \
            --remote-debugging-address=127.0.0.1 \
            --remote-debugging-port=9222 \
            '--remote-allow-origins=*' \
            "--user-data-dir=${RUNNER_TEMP}/2dog-chrome-blazor" \
            http://127.0.0.1:8000/ \
            > /tmp/2dog-blazor-browser.log 2>&1 &
          CHROME_PID=$!

          set +e
          timeout 130s node .github/scripts/wait-for-browser-smoke.mjs http://127.0.0.1:8000/ 120000 9222
          SMOKE_STATUS=$?
          set -e

          cat /tmp/2dog-blazor-server.log
          cat /tmp/2dog-blazor-browser.log

          if [ "$SMOKE_STATUS" -ne 0 ]; then
            echo "::error::The blazor host did not complete the Godot API smoke probe"
            exit "$SMOKE_STATUS"
          fi
          echo "Blazor browser smoke passed"

          # Repeated lifetimes in one page, including pointer input while running and stopped.
          set +e
          timeout 130s node .github/scripts/browser-restart-smoke.mjs http://127.0.0.1:8000/ 120000 9222 \
            | tee /tmp/2dog-blazor-restart.log
          RESTART_STATUS=$?
          set -e
          if [ "$RESTART_STATUS" -ne 0 ]; then
            # Distinguish a dead host from a browser-side fetch/cache failure.
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              echo "::error::The Blazor server exited during the restart probe"
            fi
            curl --silent --show-error --max-time 5 --output /dev/null \
              --write-out 'Blazor pack HTTP status after failure: %{http_code}\n' \
              http://127.0.0.1:8000/godot.pck || true
            cat /tmp/2dog-blazor-server.log
            cat /tmp/2dog-blazor-browser.log
            echo "::error::The blazor host could not restart the engine in the same page"
            exit "$RESTART_STATUS"
          fi
          echo "Blazor engine restart smoke passed"

      - name: Run Blazor WebGPU browser restart smoke
        if: matrix.flavor == 'blazor' && matrix.precision == 'single' && matrix.aot == false
        run: |
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          cleanup() {
            if [ -n "${CHROME_PID:-}" ]; then kill "$CHROME_PID" 2>/dev/null || true; fi
            if [ -n "${SERVER_PID:-}" ]; then kill "$SERVER_PID" 2>/dev/null || true; fi
          }
          trap cleanup EXIT
          PUB=demos/showcase/showcase.blazor/bin/${{ env.TWODOG_BUILD_SUBDIR }}Release/net10.0/publish
          ASPNETCORE_ENVIRONMENT=Production dotnet "$PUB/showcase.blazor.dll" --urls http://127.0.0.1:8000 \
            --contentroot "$(pwd)/$PUB" > /tmp/2dog-blazor-webgpu-server.log 2>&1 &
          SERVER_PID=$!
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8000/ > /dev/null; then break; fi
            sleep 1
          done
          "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage \
            --enable-unsafe-webgpu --enable-features=Vulkan --use-vulkan=swiftshader \
            --disable-vulkan-surface --enable-unsafe-swiftshader \
            --remote-debugging-address=127.0.0.1 --remote-debugging-port=9232 \
            "--user-data-dir=${RUNNER_TEMP}/2dog-chrome-blazor-webgpu" \
            'http://127.0.0.1:8000/?renderer=webgpu&method=mobile' > /tmp/2dog-blazor-webgpu-browser.log 2>&1 &
          CHROME_PID=$!
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:9232/json/list > /dev/null; then break; fi
            sleep 1
          done
          set +e
          timeout 130s node .github/scripts/browser-restart-smoke.mjs \
            'http://127.0.0.1:8000/?renderer=webgpu&method=mobile' 120000 9232 webgpu \
            | tee /tmp/2dog-blazor-webgpu-restart.log
          SMOKE_STATUS=$?
          set -e
          cat /tmp/2dog-blazor-webgpu-server.log
          cat /tmp/2dog-blazor-webgpu-browser.log
          exit "$SMOKE_STATUS"

      - name: Preserve failed web publish and browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: web-smoke-failure-${{ matrix.flavor }}-aot-${{ matrix.aot }}-${{ github.run_attempt }}-${{ matrix.precision }}
          path: |
            demos/showcase/showcase.${{ matrix.flavor }}/AppBundle/
            demos/showcase/showcase.blazor/bin/${{ env.TWODOG_BUILD_SUBDIR }}Release/net10.0/publish/
            /tmp/2dog-*.log
          retention-days: 7

  # Produce the image test independently so macOS does not wait for the Web Smoke matrix.
  webgpu-browser-build:
    name: WebGPU Browser Bundle
    needs: [pack]
    if: github.repository == 'outfox/2dog' && (!cancelled() && needs.pack.result == 'success')
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    env:
      TwoDogPrecision: single
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Install wasm-tools workload
        run: dotnet workload install wasm-tools --skip-manifest-update --source https://api.nuget.org/v3/index.json

      - name: Download native and NuGet inputs concurrently
        uses: ./.github/actions/download-ci-inputs
        with:
          precision: single

      - name: Prepare import helper
        run: |
          chmod +x godot/bin/godot.linuxbsd.editor.x86_64.executable.mono
          dotnet build twodog.import -c Release

      - name: Publish WebGPU Mobile image regression
        run: dotnet publish tests/webgpu-browser-smoke -c Release

      - name: Upload WebGPU Mobile browser image test
        uses: actions/upload-artifact@v7
        with:
          name: webgpu-mobile-bundle
          path: tests/webgpu-browser-smoke/AppBundle/
          if-no-files-found: error
          retention-days: 7

  # Check Mobile pixels on the macOS Metal GPU as well as SwiftShader above.
  webgpu-browser:
    name: WebGPU Browser Mobile
    needs: [webgpu-browser-build]
    if: github.repository == 'outfox/2dog' && (!cancelled() && needs.webgpu-browser-build.result == 'success')
    runs-on: macos-15
    timeout-minutes: 12
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Download WebGPU Mobile browser image test
        uses: actions/download-artifact@v8
        with:
          name: webgpu-mobile-bundle
          path: tests/webgpu-browser-smoke/AppBundle

      - name: Verify browser WebGPU light lists, depth fog, ambient light and MSAA
        run: |
          CHROME="/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"
          cleanup() {
            if [ -n "${CHROME_PID:-}" ]; then kill "$CHROME_PID" 2>/dev/null || true; fi
            if [ -n "${SERVER_PID:-}" ]; then kill "$SERVER_PID" 2>/dev/null || true; fi
          }
          trap cleanup EXIT
          node .github/scripts/serve-isolated.mjs tests/webgpu-browser-smoke/AppBundle 8000 > /tmp/2dog-mobile-webgpu-server.log 2>&1 &
          SERVER_PID=$!
          "$CHROME" --headless=new --enable-unsafe-webgpu --no-first-run --no-default-browser-check \
            --remote-debugging-address=127.0.0.1 --remote-debugging-port=9233 \
            "--user-data-dir=${RUNNER_TEMP}/2dog-chrome-mobile-webgpu" about:blank > /tmp/2dog-mobile-webgpu-browser.log 2>&1 &
          CHROME_PID=$!
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:9233/json/list > /dev/null && \
               curl --fail --silent http://127.0.0.1:8000/ > /dev/null; then break; fi
            sleep 1
          done
          node .github/scripts/webgpu-mobile-smoke.mjs \
            http://127.0.0.1:8000/ 9233 240000 /tmp/2dog-mobile-webgpu-captures
          node .github/scripts/webgpu-mobile-smoke.mjs \
            'http://127.0.0.1:8000/?limited-compute=1&base-formats=1&limited-bindings=1' 9233 240000 /tmp/2dog-mobile-webgpu-captures-limited

      - name: Preserve WebGPU browser images and diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: webgpu-mobile-images
          path: |
            /tmp/2dog-mobile-webgpu-*.log
            /tmp/2dog-mobile-webgpu-captures/
            /tmp/2dog-mobile-webgpu-captures-limited/
          retention-days: 7

  # The packed `2dog` tool, installed from the artifacts the way a user gets
  # it: scaffolds into a path with a space, builds and tests the result
  # against the same artifacts, and runs `2dog doctor` on it.
  maui:
    name: MAUI Builds
    needs: [pack]
    if: github.repository == 'outfox/2dog' && (!cancelled() && needs.pack.result == 'success')
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      # demos/showcase links files to templates/; Git for Windows checks symlinks out as text files by default.
      - name: Enable symlinks
        if: runner.os == 'Windows'
        run: git config --global core.symlinks true
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          lfs: true
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.IOS_DOTNET_VERSION }}

      - name: Pin SDK to the iOS workload
        run: dotnet new globaljson --sdk-version ${{ env.IOS_DOTNET_VERSION }} --roll-forward disable --force
      - name: Setup uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: '3.12'
          enable-cache: false
      # Offline downloads depend on which packs the runner image already provides.
      - name: Identify workload cache
        id: workload-cache-key
        shell: pwsh
        run: '"image=$env:ImageOS-$env:ImageVersion" >> $env:GITHUB_OUTPUT'

      - name: Cache MAUI workload downloads
        id: workload-cache
        uses: actions/cache/restore@v6
        with:
          path: .ci/maui-workloads
          key: maui-workloads-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.workload-cache-key.outputs.image }}-${{ env.IOS_DOTNET_VERSION }}-${{ env.IOS_WORKLOAD_VERSION }}

      - name: Download MAUI workloads on cache miss
        if: steps.workload-cache.outputs.cache-hit != 'true'
        run: >-
          dotnet workload install maui-windows maui-android maui-ios ios
          --version ${{ env.IOS_WORKLOAD_VERSION }} --source https://api.nuget.org/v3/index.json
          --download-to-cache .ci/maui-workloads

      # Keep successful downloads even if a later showcase build fails.
      - name: Save MAUI workload downloads
        if: steps.workload-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: .ci/maui-workloads
          key: ${{ steps.workload-cache.outputs.cache-primary-key }}

      # The download command can omit manifests required when applying the pinned workload set.
      # Use its packages as a normal feed so installation can fetch any missing dependencies.
      - name: Install MAUI workloads using cached downloads
        shell: pwsh
        run: |
          $feed = New-Item -ItemType Directory -Path .ci/maui-workload-feed -Force
          # The download cache's nested layout lacks NuGet feed metadata; expose a flat feed without copying it.
          Get-ChildItem .ci/maui-workloads -Recurse -File -Filter *.nupkg | ForEach-Object {
            New-Item -ItemType HardLink -Path (Join-Path $feed.FullName $_.Name) -Target $_.FullName | Out-Null
          }
          dotnet workload install maui-windows maui-android maui-ios ios --version ${{ env.IOS_WORKLOAD_VERSION }} --source $feed.FullName --source https://api.nuget.org/v3/index.json
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Download native and NuGet inputs concurrently
        uses: ./.github/actions/download-ci-inputs
        with:
          precision: single
      - name: Pack iOS host and MAUI integration
        run: |
          dotnet pack twodog.ios -c Release
          dotnet pack twodog.maui -c Release -p:TwoDogMauiIos=true
      - name: Build Windows showcase
        run: dotnet build demos/showcase/showcase.maui -f net10.0-windows10.0.19041.0 -c Release
      - name: Build Android showcase
        run: dotnet build demos/showcase/showcase.maui -f net10.0-android -r android-x64 -c Debug
      - name: Upload MAUI package
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages-maui
          path: |
            packages/2dog.maui.*nupkg
            packages/2dog.ios.*nupkg
          if-no-files-found: error
          retention-days: 7

  tool-smoke:
    name: Tool Smoke (${{ matrix.name }})
    needs: [pack]
    # See the test job for why this cannot rely on the implicit success().
    if: github.repository == 'outfox/2dog' && (!cancelled() && needs.pack.result == 'success')
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # Free GitHub-hosted runners: these jobs finish well before the Debug test jobs.
        include:
          - name: linux-x64
            runner: ubuntu-24.04
          - name: win-x64
            runner: windows-2025

    timeout-minutes: 20

    steps:
      # demos/showcase links files to templates/; Git for Windows checks symlinks out as text files by default.
      - name: Enable symlinks
        if: runner.os == 'Windows'
        run: git config --global core.symlinks true
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Download native and NuGet inputs concurrently
        uses: ./.github/actions/download-ci-inputs
        with:
          precision: single

      - name: Run tool smoke
        shell: bash
        run: bash .github/scripts/tool-smoke.sh

  # Warm shared tools and a pristine boot snapshot while natives/packing run.
  android-prepare:
    name: Android Smoke Cache
    needs: [check-natives]
    if: >-
      github.repository == 'outfox/2dog' &&
      (!cancelled() && needs.check-natives.result == 'success' &&
      needs.check-natives.outputs.tested-content != 'true' && needs.check-natives.outputs.tested-bump != 'true')
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    outputs:
      avd-key: ${{ steps.snapshot-key.outputs.key }}
    env:
      ANDROID_HOME: /tmp/2dog-android-sdk
      ANDROID_SDK_ROOT: /tmp/2dog-android-sdk
    steps:
      - name: Mount Android SDK
        uses: useblacksmith/stickydisk@3f6be1451e3cad893b778bc93495c80452a5da26 # v1
        with:
          key: ${{ github.repository }}-android-sdk-36-ndk29-v1
          path: ${{ env.ANDROID_HOME }}
          commit: on-change

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: microsoft
          java-version: '17'

      - name: Prepare Android SDK and system image
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '15859902'
          packages: platform-tools platforms;android-36 build-tools;36.1.0 build-tools;37.0.0 ndk;29.0.14206865 emulator system-images;android-36;google_apis;x86_64
          log-accepted-android-sdk-licenses: false

      - name: Keep command-line tools at the path expected by emulator-runner
        run: ln -sfnT 22.0 "$ANDROID_HOME/cmdline-tools/latest"

      - name: Key snapshot to installed emulator and image
        id: snapshot-key
        run: |
          version=$(cat "$ANDROID_HOME/emulator/source.properties" "$ANDROID_HOME/system-images/android-36/google_apis/x86_64/source.properties" | sha256sum | cut -c1-16)
          echo "key=${GITHUB_REPOSITORY}-android-avd-ubuntu2404-api36-x64-swangle-${version}-v1" >> "$GITHUB_OUTPUT"

      - name: Mount pristine emulator snapshot
        uses: useblacksmith/stickydisk@3f6be1451e3cad893b778bc93495c80452a5da26 # v1
        with:
          key: ${{ steps.snapshot-key.outputs.key }}
          path: ~/.android
          commit: on-change

      - name: Check snapshot
        id: snapshot
        run: |
          if test -s ~/.android/avd/2dog-ci.avd/snapshots/default_boot/snapshot.pb; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Enable emulator acceleration
        if: steps.snapshot.outputs.ready != 'true'
        run: sudo chmod 666 /dev/kvm

      - name: Generate clean emulator snapshot
        if: steps.snapshot.outputs.ready != 'true'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          avd-name: 2dog-ci
          force-avd-creation: true
          emulator-options: -no-window -gpu swangle -noaudio -no-boot-anim -camera-back none
          script: adb -s emulator-5554 emu avd snapshot save default_boot

      - name: Verify snapshot is ready
        run: |
          for attempt in $(seq 1 30); do
            if ! pgrep -f '[q]emu-system.*-avd 2dog-ci' > /dev/null; then break; fi
            sleep 1
          done
          ! pgrep -f '[q]emu-system.*-avd 2dog-ci' > /dev/null
          test -s ~/.android/avd/2dog-ci.avd/snapshots/default_boot/snapshot.pb

  # One APK per job: no shared bin/obj files, and arm64 needs no emulator.
  android-smoke:
    name: Android Smoke (${{ matrix.apk.name }}) [${{ matrix.precision }}]
    needs: [check-natives, pack, android-prepare]
    if: >-
      github.repository == 'outfox/2dog' &&
      (!cancelled() && needs.pack.result == 'success' && needs.android-prepare.result == 'success' &&
      needs.check-natives.outputs.tested-bump != 'true')
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        precision: [single, double]
        apk:
          - {name: smoke-debug, app: smoke, configuration: Debug, rid: android-x64, aot: false, package: dev.twodog.smoke, marker: 2DOG_ANDROID_CSHARP_SMOKE_PASSED}
          - {name: showcase-debug, app: showcase, configuration: Debug, rid: android-x64, aot: false, package: dev.twodog.showcase, marker: 2DOG_ANDROID_SHOWCASE_SMOKE_PASSED}
          - {name: showcase-release, app: showcase, configuration: Release, rid: android-x64, aot: false, package: dev.twodog.showcase, marker: 2DOG_ANDROID_SHOWCASE_SMOKE_PASSED}
          - {name: showcase-arm64, app: showcase, configuration: Release, rid: android-arm64, aot: false, package: dev.twodog.showcase, marker: 2DOG_ANDROID_SHOWCASE_SMOKE_PASSED}
          - {name: showcase-nativeaot, app: showcase, configuration: Release, rid: android-x64, aot: true, package: dev.twodog.showcase, marker: 2DOG_ANDROID_SHOWCASE_SMOKE_PASSED}
    env:
      TwoDogPrecision: ${{ matrix.precision }}
      ANDROID_HOME: /tmp/2dog-android-sdk
      ANDROID_SDK_ROOT: /tmp/2dog-android-sdk
      ANDROID_NDK_ROOT: /tmp/2dog-android-sdk/ndk/29.0.14206865
      ANDROID_NDK_HOME: /tmp/2dog-android-sdk/ndk/29.0.14206865
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Setup uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: '3.12'
          enable-cache: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: microsoft
          java-version: '17'

      - name: Mount Android SDK
        uses: useblacksmith/stickydisk@3f6be1451e3cad893b778bc93495c80452a5da26 # v1
        with:
          key: ${{ github.repository }}-android-sdk-36-ndk29-v1
          path: ${{ env.ANDROID_HOME }}
          commit: 'false'

      # Installed packages are reused; a missing sticky mount must still support a cold build.
      - name: Ensure Android build tools
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '15859902'
          packages: platform-tools platforms;android-36 build-tools;36.1.0 ndk;29.0.14206865
          log-accepted-android-sdk-licenses: false

      - name: Keep command-line tools at the path expected by emulator-runner
        run: ln -sfnT 22.0 "$ANDROID_HOME/cmdline-tools/latest"

      - name: Install Android workload
        run: dotnet workload install android --skip-manifest-update --source https://api.nuget.org/v3/index.json

      - name: Mount Android inputs
        uses: useblacksmith/stickydisk@3f6be1451e3cad893b778bc93495c80452a5da26 # v1
        with:
          key: ${{ github.repository }}-android-inputs-${{ matrix.precision }}-v1
          path: .ci/android-inputs
          commit: 'false'

      - name: Check inputs belong to this run
        id: inputs
        run: |
          if uv run --no-project python scripts/stage_android_ci.py check --precision "$TwoDogPrecision" --identity "$GITHUB_RUN_ID:$GITHUB_SHA"; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            uv run --no-project python scripts/stage_android_ci.py reset
          fi

      # A different branch may have committed the same disk key after pack.
      - name: Download matching Android inputs on cache miss
        if: steps.inputs.outputs.ready != 'true'
        uses: actions/download-artifact@v8
        with:
          name: android-inputs-${{ matrix.precision }}
          path: .ci/android-inputs

      - name: Mount NuGet cache
        uses: useblacksmith/stickydisk@3f6be1451e3cad893b778bc93495c80452a5da26 # v1
        with:
          key: ${{ github.repository }}-android-nuget-linux-${{ matrix.precision }}-v1
          path: .packages
          commit: on-change

      - name: Prepare fork SDK and selected native reference bytes
        run: |
          uv run --no-project python scripts/stage_android_ci.py check --precision "$TwoDogPrecision" --identity "$GITHUB_RUN_ID:$GITHUB_SHA"
          uv run --no-project python scripts/stage_android_ci.py prepare --precision "$TwoDogPrecision" --rid '${{ matrix.apk.rid }}' --configuration '${{ matrix.apk.configuration }}'

      - name: Build and inspect APK
        env:
          APK_AOT: ${{ matrix.apk.aot }}
        run: |
          extra=()
          if [ "$APK_AOT" = true ]; then extra+=(--aot); fi
          uv run scripts/build_android_apk.py --app '${{ matrix.apk.app }}' --feed .ci/android-inputs/packages \
            --rid '${{ matrix.apk.rid }}' --configuration '${{ matrix.apk.configuration }}' \
            --restore-cache .packages --output artifacts/android-apk "${extra[@]}"
          "$ANDROID_HOME/build-tools/36.1.0/apksigner" verify artifacts/android-apk/apk/*-Signed.apk

      - name: Upload APK and inspection report
        uses: actions/upload-artifact@v7
        with:
          name: android-apks-${{ matrix.precision }}-${{ matrix.apk.name }}
          path: |
            artifacts/android-apk/apk/*-Signed.apk
            artifacts/android-apk/apk-report.json
          if-no-files-found: error
          retention-days: 7

      - name: Mount pristine emulator snapshot
        if: matrix.apk.rid == 'android-x64'
        uses: useblacksmith/stickydisk@3f6be1451e3cad893b778bc93495c80452a5da26 # v1
        with:
          key: ${{ needs.android-prepare.outputs.avd-key }}
          path: ~/.android
          commit: 'false'

      - name: Enable emulator acceleration
        if: matrix.apk.rid == 'android-x64'
        run: sudo chmod 666 /dev/kvm

      - name: Run APK on the emulator
        if: matrix.apk.rid == 'android-x64'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          avd-name: 2dog-ci
          force-avd-creation: false
          disable-animations: true
          emulator-options: -no-snapshot-save -snapshot default_boot -no-window -gpu swangle -noaudio -no-boot-anim -camera-back none
          script: >-
            uv run scripts/test_android_device.py artifacts/android-apk/apk/*-Signed.apk
            --serial emulator-5554 --package '${{ matrix.apk.package }}' --marker '${{ matrix.apk.marker }}' --timeout 120;
            status=$?; adb -s emulator-5554 logcat -d -b all > artifacts/android-apk/logcat.txt; exit "$status"

      - name: Upload emulator diagnostics
        if: always() && matrix.apk.rid == 'android-x64'
        uses: actions/upload-artifact@v7
        with:
          name: android-emulator-logcat-${{ matrix.precision }}-${{ matrix.apk.name }}
          path: artifacts/android-apk/logcat.txt
          if-no-files-found: ignore
          retention-days: 7

  # Three complementary cells cover the bare host, trimmed double showcase/GDExtension, and MAUI embedding.
  ios-smoke:
    name: iOS Smoke (${{ matrix.app }}, ${{ matrix.configuration }}) [${{ matrix.precision }}]
    needs: [check-natives, pack, maui]
    if: >-
      github.repository == 'outfox/2dog' &&
      (!cancelled() && needs.pack.result == 'success' && needs.maui.result == 'success' &&
      needs.check-natives.outputs.tested-bump != 'true')
    runs-on: macos-26
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {app: smoke, configuration: Debug, precision: single, bundle: dev.twodog.smoke, marker: 2DOG_IOS_CSHARP_SMOKE_PASSED}
          - {app: showcase, configuration: Release, precision: double, bundle: dev.twodog.showcase, marker: 2DOG_IOS_SHOWCASE_SMOKE_PASSED}
          - {app: maui, configuration: Debug, precision: single, bundle: com.companyname.showcase.maui, marker: 2DOG_MAUI_SHOWCASE_SMOKE_PASSED}
    env:
      TwoDogPrecision: ${{ matrix.precision }}
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.IOS_DOTNET_VERSION }}

      - name: Pin SDK to the iOS workload
        run: dotnet new globaljson --sdk-version ${{ env.IOS_DOTNET_VERSION }} --roll-forward disable --force

      - name: Setup uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: '3.12'
          enable-cache: false

      - name: Install iOS workloads
        run: dotnet workload install ios maui-ios --version ${{ env.IOS_WORKLOAD_VERSION }} --source https://api.nuget.org/v3/index.json

      - name: Download iOS inputs
        uses: actions/download-artifact@v8
        with:
          name: ios-inputs-${{ matrix.precision }}

      - name: Download iOS host and MAUI packages
        uses: actions/download-artifact@v8
        with:
          name: nuget-packages-maui
          path: packages

      - name: Build and inspect Simulator app
        run: >-
          uv run scripts/build_ios_app.py --app '${{ matrix.app }}' --feed packages
          --configuration '${{ matrix.configuration }}' --output artifacts/ios-app

      # Preserve permissions, symlinks and bundle layout; artifact upload alone does not.
      - name: Archive Simulator app and inspection report
        run: ditto -c -k --sequesterRsrc --keepParent artifacts/ios-app/app/*.app artifacts/ios-app/simulator-app.zip

      - name: Upload Simulator app
        uses: actions/upload-artifact@v7
        with:
          name: ios-simulator-${{ matrix.app }}-${{ matrix.precision }}-${{ matrix.configuration }}
          path: |
            artifacts/ios-app/simulator-app.zip
            artifacts/ios-app/app-report.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Boot Simulator and run C# smoke
        env:
          SIMCTL_CHILD_CI: 'true'
        timeout-minutes: 6
        shell: bash
        run: |
          runtime=$(xcrun simctl list runtimes --json | jq -r '[.runtimes[] | select(.isAvailable and (.identifier | contains(".iOS-")))] | last | .identifier // empty')
          test -n "$runtime"
          device=$(xcrun simctl create 2dog-ci com.apple.CoreSimulator.SimDeviceType.iPhone-17-Pro "$runtime")
          trap 'xcrun simctl shutdown "$device" || true' EXIT
          xcrun simctl boot "$device"
          xcrun simctl bootstatus "$device" -b
          uv run scripts/test_ios_simulator.py artifacts/ios-app/app/*.app --device "$device" \
            --bundle '${{ matrix.bundle }}' --marker '${{ matrix.marker }}' --timeout 120 \
            2>&1 | tee artifacts/ios-app/simulator.log

      - name: Upload Simulator diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-simulator-log-${{ matrix.app }}-${{ matrix.precision }}-${{ matrix.configuration }}
          path: artifacts/ios-app/simulator.log
          if-no-files-found: ignore
          retention-days: 7

  # Deploy to NuGet and create GitHub release when running on a version tag —
  # either pushed directly or dispatched on the tag by release.yml (tags pushed
  # with GITHUB_TOKEN don't fire push events, so release.yml dispatches instead).
  # Uses NuGet Trusted Publishing (OIDC) — no long-lived API key is stored.
  deploy:
    name: Deploy to NuGet
    # web-smoke and android-smoke gate deploy because the 2dog.browser-wasm and
    # 2dog.android packages they exercise are among the packages being
    # published; desktop-smoke gates it because it is the only check that runs
    # a Release-only publish; tool-smoke because it installs the packed `2dog`
    # tool the way users get it. A tested revision bump (see check-natives) takes
    # the test, desktop and Android verdicts from its parent commit's run.
    needs: [check-natives, test-build-configuration, test-binding-packages, test, test-contracts, windows-rendering, desktop-smoke, webgpu-desktop, web-smoke, webgpu-browser, android-smoke, ios-smoke, tool-smoke, maui]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    # Explicit result checks (not the implicit success()) for the same
    # transitive-skip reason as the test job — deploy must still require all
    # gates to have actually succeeded.
    if: >-
      github.repository == 'outfox/2dog' &&
      (!cancelled() && startsWith(github.ref, 'refs/tags/v') &&
      needs.test-build-configuration.result == 'success' && needs.test-binding-packages.result == 'success' &&
      (needs.check-natives.outputs.tested-bump == 'true' ||
      (needs.test.result == 'success' && needs.test-contracts.result == 'success' && needs.windows-rendering.result == 'success' &&
      needs.desktop-smoke.result == 'success' && needs.webgpu-desktop.result == 'success' && needs.android-smoke.result == 'success' && needs.ios-smoke.result == 'success')) &&
      needs.web-smoke.result == 'success' && needs.webgpu-browser.result == 'success' &&
      needs.tool-smoke.result == 'success' && needs.maui.result == 'success')
    permissions:
      contents: write # required to create the GitHub Release for the tag
      id-token: write # required to request the GitHub OIDC token for Trusted Publishing

    steps:
      - name: Checkout CI helpers
        uses: actions/checkout@v7

      - name: Download NuGet packages
        uses: actions/download-artifact@v8
        with:
          name: nuget-packages-single
          path: packages

      - name: Download double NuGet packages
        uses: actions/download-artifact@v8
        with:
          name: nuget-packages-double
          path: packages-double

      - name: Include precision-specific double packages
        run: cp packages-double/2dog.*.double.*nupkg packages/

      - name: Download MAUI package
        uses: actions/download-artifact@v8
        with:
          name: nuget-packages-maui
          path: packages

      # Defense in depth: the pack job already verified the tag against the props
      # file, but refuse to publish unless the artifact really contains packages
      # at the tag's version.
      - name: Verify packages match tag
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          for pkg in "2dog" "2dog.templates" "2dog.godotsharp" "2dog.godotsharp.editor" "2dog.engine" "2dog.avalonia" "2dog.blazor" "2dog.qt" "2dog.repl" "2dog.gdunit" "2dog.maui" "2dog.ios"; do
            if [[ ! -f "packages/${pkg}.${TAG_VERSION}.nupkg" ]]; then
              echo "::error::packages/ does not contain ${pkg}.${TAG_VERSION}.nupkg — refusing to publish."
              echo "Artifact contents:"
              ls -lh packages/
              exit 1
            fi
          done

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # Exchange the GitHub OIDC token for a short-lived NuGet API key via the
      # Trusted Publishing policy configured on nuget.org. `NUGET_USER` is a repo
      # secret holding the nuget.org account that owns the policy.
      - name: NuGet login (Trusted Publishing)
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          bash .github/scripts/push-nuget.sh packages

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --generate-notes \
            packages/*.nupkg packages/*.snupkg
