name: 2dog Android APK

on:
  workflow_dispatch:
    inputs:
      rid:
        type: choice
        options: [android-x64, android-arm64]
        default: android-x64
      configuration:
        type: choice
        options: [Debug, Release]
        default: Debug
  push:
    branches: [main, 'android-apk*']
    paths:
      - 'godot'
      - 'platforms/**'
      - 'twodog.engine/**'
      - 'twodog.godotsharp*/**'
      - 'twodog.import/**'
      - 'scripts/*android*.py'
      - 'tests/android/**'
      - 'demos/showcase/**'
      - 'Directory.Build.*'
      - 'build-godot.py'
      - 'global.json'
      - 'pyproject.toml'
      - '.github/workflows/build-natives.yml'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    runs-on: blacksmith-16vcpu-ubuntu-2404
    outputs:
      hash: ${{ steps.source.outputs.hash }}
    steps:
      - uses: actions/checkout@v7
      - id: source
        run: echo "hash=$(git rev-parse HEAD:godot | cut -c1-7)" >> "$GITHUB_OUTPUT"
  natives:
    needs: source
    permissions:
      contents: write
    concurrency:
      # Share the regular CI build gate so both workflows reuse one release.
      group: natives-build-${{ needs.source.outputs.hash }}
      cancel-in-progress: false
    uses: ./.github/workflows/build-natives.yml
    with:
      create_release: true
  apk:
    name: Build and inspect Android APKs
    needs: natives
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 90
    env:
      RID: ${{ inputs.rid || 'android-x64' }}
      CONFIGURATION: ${{ inputs.configuration || 'Debug' }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          # The showcase's LFS assets (e.g. splash.png) must be real files for the import and pck export
          lfs: true
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-java@v5
        with:
          distribution: microsoft
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android build tools
        run: |
          python -m pip install 'rich>=14.2.0' 'scons>=4.9.1,<5.0.0'
          dotnet workload install android --skip-manifest-update --source https://api.nuget.org/v3/index.json
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.1.0' 'ndk;29.0.14206865'
      - name: Stage source-matched editor and managed bindings
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          hash=$(git rev-parse HEAD:godot | cut -c1-7)
          mkdir -p artifacts/prerequisites
          gh release download "godot-$hash" --repo "$GITHUB_REPOSITORY" --dir artifacts/prerequisites \
            --pattern godotsharp.zip --pattern godotsharp-nupkgs.zip \
            --pattern godot-source-generators.zip --pattern godot-editor-linux-x64.zip
          mkdir -p godot/bin/GodotSharp/Tools/nupkgs \
            godot/modules/mono/editor/Godot.NET.Sdk/Godot.SourceGenerators/bin/Release/netstandard2.0
          unzip -oq artifacts/prerequisites/godotsharp.zip -d godot/bin/GodotSharp
          unzip -oq artifacts/prerequisites/godotsharp-nupkgs.zip -d godot/bin/GodotSharp/Tools/nupkgs
          unzip -oq artifacts/prerequisites/godot-source-generators.zip \
            -d godot/modules/mono/editor/Godot.NET.Sdk/Godot.SourceGenerators/bin/Release/netstandard2.0
          unzip -oq artifacts/prerequisites/godot-editor-linux-x64.zip -d godot/bin
          chmod +x godot/bin/godot.linuxbsd.editor.x86_64.executable.mono
      - uses: actions/cache@v6
        with:
          path: godot/.scons_cache
          key: android-apk-${{ runner.os }}-${{ env.RID }}-${{ hashFiles('godot/platform/android/detect.py', 'build-godot.py') }}-${{ github.sha }}
          restore-keys: |
            android-apk-${{ runner.os }}-${{ env.RID }}-
      - name: Build smoke APK from local packages
        run: |
          python scripts/build_android_apk.py --rid "$RID" --configuration "$CONFIGURATION" \
            --editor godot/bin/godot.linuxbsd.editor.x86_64.executable.mono --cache-path godot/.scons_cache
          "$ANDROID_HOME/build-tools/36.1.0/apksigner" verify artifacts/android-apk/apk/*-Signed.apk
      # Reuses the natives and Java payloads staged above; its GDExtension probe uses the installed NDK
      - name: Build showcase APK from local packages
        run: |
          python scripts/build_android_apk.py --app showcase --rid "$RID" --configuration "$CONFIGURATION" \
            --editor godot/bin/godot.linuxbsd.editor.x86_64.executable.mono --skip-native --skip-java
          "$ANDROID_HOME/build-tools/36.1.0/apksigner" verify artifacts/android-showcase-apk/apk/*-Signed.apk
      - uses: actions/upload-artifact@v7
        with:
          name: android-apk-${{ env.RID }}-${{ env.CONFIGURATION }}
          path: |
            artifacts/android-apk/apk/*-Signed.apk
            artifacts/android-apk/apk-report.json
            artifacts/android-showcase-apk/apk/*-Signed.apk
            artifacts/android-showcase-apk/apk-report.json
          if-no-files-found: error
          retention-days: 7
      - name: Enable emulator acceleration
        if: env.RID == 'android-x64'
        run: sudo chmod 666 /dev/kvm
      - name: Run Android smoke and showcase tests
        if: env.RID == 'android-x64'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swangle -noaudio -no-boot-anim -camera-back none
          # The action runs each script line separately; folding keeps this one shell command.
          script: >-
            python scripts/test_android_device.py artifacts/android-apk/apk/dev.twodog.smoke-Signed.apk
            --serial emulator-5554 --timeout 120
            && python scripts/test_android_device.py artifacts/android-showcase-apk/apk/dev.twodog.showcase-Signed.apk
            --serial emulator-5554 --package dev.twodog.showcase --marker 2DOG_ANDROID_SHOWCASE_SMOKE_PASSED --timeout 120;
            status=$?; adb -s emulator-5554 logcat -d -b all > artifacts/android-apk/logcat.txt; exit "$status"
      - name: Upload emulator diagnostics
        if: always() && env.RID == 'android-x64'
        uses: actions/upload-artifact@v7
        with:
          name: android-emulator-${{ env.CONFIGURATION }}
          path: artifacts/android-apk/logcat.txt
          retention-days: 7
