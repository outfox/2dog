name: 2dog Build Natives

# Reusable workflow: ci.yml calls it when the godot-<hash>[-double] natives release is
# missing; workflow_dispatch remains for manual force rebuilds. The inputs are
# declared under both triggers — workflow_call and workflow_dispatch have
# separate input schemas.
on:
  workflow_call:
    inputs:
      precision:
        description: 'Godot scalar precision (single or double)'
        type: string
        default: single
      create_release:
        description: 'Create GitHub release'
        type: boolean
        default: true
      force:
        description: 'Force rebuild even if release exists'
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      precision:
        description: 'Godot scalar precision (single or double)'
        type: choice
        options: [single, double]
        default: single
      create_release:
        description: 'Create GitHub release'
        type: boolean
        default: true
      force:
        description: 'Force rebuild even if release exists'
        type: boolean
        default: false

permissions:
  contents: write

env:
  NATIVE_SUBDIR: ${{ inputs.precision == 'double' && 'double/' || '' }}
  NATIVE_SUFFIX: ${{ inputs.precision == 'double' && '.double' || '' }}
  RELEASE_SUFFIX: ${{ inputs.precision == 'double' && '-double' || '' }}

jobs:
  # Quick check: compute submodule hash and see if a complete release already exists.
  preflight:
    if: github.repository == 'outfox/2dog'
    name: Preflight
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 5
    outputs:
      submodule-hash: ${{ steps.hash.outputs.hash }}
      skip: ${{ steps.check-release.outputs.skip }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Compute submodule hash
        id: hash
        run: |
          HASH=$(git ls-tree HEAD godot | awk '{print $3}' | cut -c1-7)
          echo "hash=$HASH" >> $GITHUB_OUTPUT
          echo "Godot submodule hash: $HASH"

      - name: Check if release already exists
        id: check-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "${{ inputs.precision }}" != single && "${{ inputs.precision }}" != double ]]; then
            echo "::error::precision must be single or double"; exit 1
          fi
          TAG="godot-${{ steps.hash.outputs.hash }}${RELEASE_SUFFIX}"
          # `inputs`, not `github.event.inputs`: in workflow_call mode the
          # github.event* context belongs to the caller's triggering event.
          FORCE="${{ inputs.force }}"
          if [ "$FORCE" != "true" ] && bash scripts/check_natives_release.sh "$TAG"; then
            echo "Release $TAG already exists — skipping builds"
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

  # GodotSharp assemblies are platform-independent — only need to build once on Linux.
  # This job also produces the Linux editor binary needed for project import in CI.
  build-godotsharp:
    name: Build GodotSharp (${{ inputs.precision }})
    needs: preflight
    if: github.repository == 'outfox/2dog' && (needs.preflight.outputs.skip != 'true')
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: '3.12'
          enable-cache: false

      # The runner image's preinstalled SDKs may lag the global.json pin.
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libx11-dev \
            libxcursor-dev \
            libxinerama-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            libasound2-dev \
            libpulse-dev \
            libudev-dev \
            libxi-dev \
            libxrandr-dev \
            libwayland-dev

      - name: Cache SCons
        uses: actions/cache@v6
        with:
          path: |
            godot/.scons_cache
            ~/.cache/scons
          key: godotsharp-linux-${{ inputs.precision }}-${{ needs.preflight.outputs.submodule-hash }}
          restore-keys: |
            godotsharp-linux-${{ inputs.precision }}-

      - name: Test native WebGPU configuration
        run: uv run python -m unittest discover -s godot/webgpu_tests -p 'test_native*.py' -v

      - name: Build editor + GodotSharp assemblies
        run: |
          uv run build-godot.py --precision ${{ inputs.precision }} \
            --no-library \
            --debug-symbols no \
            --dev-build no \
            --cache-path godot/.scons_cache

      - name: Upload GodotSharp assemblies
        uses: actions/upload-artifact@v7
        with:
          name: godotsharp-${{ inputs.precision }}
          path: godot/bin/${{ env.NATIVE_SUBDIR }}GodotSharp/
          if-no-files-found: error
          retention-days: 7

      - name: Upload GodotSharp NuGet packages
        uses: actions/upload-artifact@v7
        with:
          name: godotsharp-nupkgs-${{ inputs.precision }}
          path: godot/bin/${{ env.NATIVE_SUBDIR }}GodotSharp/Tools/nupkgs/
          if-no-files-found: error
          retention-days: 7

      - name: Upload source generators
        uses: actions/upload-artifact@v7
        with:
          name: godot-source-generators-${{ inputs.precision }}
          path: godot/modules/mono/editor/Godot.NET.Sdk/Godot.SourceGenerators/bin/Release/netstandard2.0/Godot.SourceGenerators.dll
          if-no-files-found: error
          retention-days: 7

      - name: Upload Linux editor binary
        uses: actions/upload-artifact@v7
        with:
          name: godot-editor-linux-x64-${{ inputs.precision }}
          path: |
            godot/bin/godot.linuxbsd.editor${{ env.NATIVE_SUFFIX }}.x86_64.executable.mono
            godot/bin/libgodot_webgpu_dawn.so
            godot/bin/webgpu/linux-x64/licenses/
          if-no-files-found: error
          retention-days: 7

  # Build native libgodot libraries for all platform/variant combinations.
  # The artifact name libgodot-{rid}-{target} is the contract with ci.yml's
  # staging step; the zip attached to the release contains the library under
  # its original Godot file name (e.g. godot.windows.editor.x86_64.shared_library.dll).
  build-natives:
    name: Build libgodot-${{ matrix.rid }}${{ matrix.flavor }}-${{ matrix.target }} (${{ inputs.precision }})
    needs: preflight
    if: github.repository == 'outfox/2dog' && (needs.preflight.outputs.skip != 'true')
    runs-on: ${{ matrix.runner }}
    # A cold SCons cache is far slower than the warm ~7 min wall time.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        target: [template_release, template_debug, editor]
        platform: [linuxbsd, windows, macos]
        include:
          - platform: linuxbsd
            runner: blacksmith-8vcpu-ubuntu-2404
            arch: x86_64
            rid: linux-x64
            lib_ext: so
          - platform: windows
            runner: blacksmith-8vcpu-windows-2025
            arch: x86_64
            rid: win-x64
            lib_ext: dll
          - platform: macos
            runner: blacksmith-12vcpu-macos-latest
            arch: arm64
            rid: osx-arm64
            lib_ext: dylib
          # Android (experimental): libgodot_android.so + libc++_shared.so per ABI,
          # no editor target. Godot's Java host comes from build-android-java.
          - platform: android
            target: template_release
            runner: blacksmith-4vcpu-ubuntu-2404
            arch: arm64
            rid: android-arm64
          - platform: android
            target: template_debug
            runner: blacksmith-4vcpu-ubuntu-2404
            arch: arm64
            rid: android-arm64
          - platform: android
            target: template_release
            runner: blacksmith-4vcpu-ubuntu-2404
            arch: x86_64
            rid: android-x64
          - platform: android
            target: template_debug
            runner: blacksmith-4vcpu-ubuntu-2404
            arch: x86_64
            rid: android-x64
          # Web (browser-wasm) static libraries: no editor target, built with
          # the emscripten version pinned in Directory.Build.props (must match
          # the .NET browser-wasm runtime pack the consumers publish with).
          - platform: web
            target: template_release
            runner: blacksmith-8vcpu-ubuntu-2404
            arch: wasm32
            rid: browser-wasm
            lib_ext: a
          - platform: web
            target: template_debug
            runner: blacksmith-8vcpu-ubuntu-2404
            arch: wasm32
            rid: browser-wasm
            lib_ext: a
          # WasmEnableThreads hosts link a -pthread build staged under web-threads/ (build-godot.py --threads).
          - platform: web
            target: template_release
            runner: blacksmith-4vcpu-ubuntu-2404
            arch: wasm32
            rid: browser-wasm
            lib_ext: a
            flavor: -threads
            build_args: --threads
          - platform: web
            target: template_debug
            runner: blacksmith-4vcpu-ubuntu-2404
            arch: wasm32
            rid: browser-wasm
            lib_ext: a
            flavor: -threads
            build_args: --threads

    # From Godot upstream CI (windows_builds.yml): cache SCons's MSVC
    # environment detection, and keep Python console output UTF-8 clean on
    # the Windows runners (build-godot.py uses rich).
    env:
      SCONS_CACHE_MSVC_CONFIG: true
      PYTHONIOENCODING: utf8

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: '3.12'
          enable-cache: false

      # The pinned Dawn SDK uses STL helpers newer than the runner's VS 2022 toolset.
      - name: Install MSVC Build Tools for native Dawn
        if: matrix.platform == 'windows' && inputs.precision == 'single'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $tools = & $vswhere -latest -products '*' -version '[18.0,19.0)' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $tools) {
            $bootstrapper = Join-Path $env:RUNNER_TEMP 'vs_buildtools.exe'
            Invoke-WebRequest 'https://aka.ms/vs/stable/vs_buildtools.exe' -OutFile $bootstrapper
            $signature = Get-AuthenticodeSignature $bootstrapper
            if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'O=Microsoft Corporation') {
              throw 'Visual Studio bootstrapper signature is not valid for Microsoft Corporation.'
            }
            $installer = Start-Process $bootstrapper -ArgumentList '--quiet', '--wait', '--norestart', '--nocache', '--add', 'Microsoft.VisualStudio.Component.VC.Tools.x86.x64' -WindowStyle Hidden -PassThru -Wait
            if ($installer.ExitCode -notin 0, 3010) { throw "Build Tools install failed: $($installer.ExitCode)" }
          }

      # Linux-specific dependencies
      - name: Install Linux dependencies
        if: matrix.platform == 'linuxbsd'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libx11-dev \
            libxcursor-dev \
            libxinerama-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            libasound2-dev \
            libpulse-dev \
            libudev-dev \
            libxi-dev \
            libxrandr-dev \
            libwayland-dev

      - name: Install Vulkan SDK (macOS)
        if: matrix.platform == 'macos'
        run: sh godot/misc/scripts/install_vulkan_sdk_macos.sh

      # Web: emscripten pinned to the version the .NET browser-wasm runtime
      # pack was built with (the static libgodot.a is linked into
      # dotnet.native.wasm at consumer publish time, so they must match).
      - name: Read pinned emscripten version
        if: matrix.platform == 'web'
        id: emsdk-version
        run: |
          VERSION=$(sed -n 's/.*<EmscriptenVersion>\(.*\)<\/EmscriptenVersion>.*/\1/p' Directory.Build.props)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Pinned emscripten: $VERSION"

      - name: Setup emsdk
        if: matrix.platform == 'web'
        uses: emscripten-core/setup-emsdk@v16
        with:
          version: ${{ steps.emsdk-version.outputs.version }}
          actions-cache-folder: emsdk-cache

      # Android: the NDK pinned in godot/platform/android/detect.py; sdkmanager needs Java 17
      - name: Setup Java (Android)
        if: matrix.platform == 'android'
        uses: actions/setup-java@v5
        with:
          distribution: microsoft
          java-version: '17'

      - name: Setup Android NDK
        if: matrix.platform == 'android'
        uses: android-actions/setup-android@v3
        with:
          packages: ndk;29.0.14206865
          log-accepted-android-sdk-licenses: false

      # Cache SCons build
      - name: Cache SCons
        uses: actions/cache@v6
        with:
          path: |
            godot/.scons_cache
            ~/.cache/scons
          key: libgodot-${{ inputs.precision }}-${{ matrix.rid }}${{ matrix.flavor }}-${{ matrix.target }}-${{ needs.preflight.outputs.submodule-hash }}
          restore-keys: |
            libgodot-${{ inputs.precision }}-${{ matrix.rid }}${{ matrix.flavor }}-${{ matrix.target }}-

      # Build using build-godot.py with platform/arch overrides
      - name: Build libgodot (${{ matrix.target }})
        run: |
          uv run build-godot.py --precision ${{ inputs.precision }} \
            --platform ${{ matrix.platform }} \
            --arch ${{ matrix.arch }} \
            --target ${{ matrix.target }} \
            --no-editor \
            --no-glue \
            --dev-build no \
            --debug-symbols no \
            --scu-build yes \
            --cache-path godot/.scons_cache ${{ matrix.build_args }}

      # Upload the library under its original Godot file name; the release job
      # zips each artifact directory as-is.
      - name: Upload artifact
        if: matrix.platform != 'web' && matrix.platform != 'android'
        uses: actions/upload-artifact@v7
        with:
          name: libgodot-${{ matrix.rid }}-${{ matrix.target }}-${{ inputs.precision }}
          path: |
            godot/bin/${{ env.NATIVE_SUBDIR }}*godot.${{ matrix.platform }}.${{ matrix.target }}${{ env.NATIVE_SUFFIX }}.${{ matrix.arch }}.shared_library.${{ matrix.lib_ext }}
            godot/bin/${{ env.NATIVE_SUBDIR }}webgpu/${{ matrix.rid }}/
          if-no-files-found: error
          retention-days: 7

      # Web uploads the whole payload directory (libgodot/ archive + JS glue,
      # shell/ boot files) - the contract with ci.yml's staging step and the
      # 2dog.browser-wasm packages.
      - name: Upload artifact (web payload)
        if: matrix.platform == 'web'
        uses: actions/upload-artifact@v7
        with:
          name: libgodot-${{ matrix.rid }}${{ matrix.flavor }}-${{ matrix.target }}-${{ inputs.precision }}
          path: godot/bin/${{ env.NATIVE_SUBDIR }}web${{ matrix.flavor }}/${{ matrix.target }}/
          if-no-files-found: error
          retention-days: 7

      # Android uploads the ABI's staged pair (build-godot.py keeps the JNI name libgodot_android.so) - the
      # contract with ci.yml's staging step and the 2dog.android-<abi> packages.
      - name: Upload artifact (Android natives)
        if: matrix.platform == 'android'
        uses: actions/upload-artifact@v7
        with:
          name: libgodot-${{ matrix.rid }}-${{ matrix.target }}-${{ inputs.precision }}
          path: godot/bin/${{ env.NATIVE_SUBDIR }}android/${{ matrix.target }}/${{ matrix.arch }}/
          if-no-files-found: error
          retention-days: 7

  # Godot's Android Java host (godot.aar, debug + release) for the 2dog.android package. Gradle only compiles Java and
  # Kotlin here: build_android_java.py excludes the native SCons tasks and strips natives from the AARs (they ship in
  # the per-ABI packages), but Gradle still resolves scons while configuring.
  build-android-java:
    name: Build Android Java host
    needs: preflight
    if: github.repository == 'outfox/2dog' && (needs.preflight.outputs.skip != 'true')
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: '3.12'
          enable-cache: false

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: microsoft
          java-version: '17'
          cache: gradle
          cache-dependency-path: godot/platform/android/java/**/*.gradle*

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-36 build-tools;36.1.0 ndk;29.0.14206865
          log-accepted-android-sdk-licenses: false

      - name: Build Godot Android library
        run: uv run scripts/build_android_java.py

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: godot-android-java-${{ inputs.precision }}
          path: godot/bin/android/java/
          if-no-files-found: error
          retention-days: 7

  # Create a GitHub release tagged godot-{hash} with all native libs + GodotSharp
  release:
    name: Create Release
    needs: [preflight, build-godotsharp, build-natives, build-android-java]
    # Gate on the `inputs` context only: github.event* belongs to the caller's
    # event in workflow_call mode and would silently skip this job there.
    if: github.repository == 'outfox/2dog' && (needs.preflight.outputs.skip != 'true' && inputs.create_release)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    # Serialize the delete+create against concurrent creators of the same hash
    # (including manual force dispatches).
    concurrency:
      group: natives-release-${{ inputs.precision }}-${{ needs.preflight.outputs.submodule-hash }}
      cancel-in-progress: false

    steps:
      # In workflow_call mode this downloads all artifacts of the *caller's*
      # run. Safe only because `needs` orders this job strictly before ci.yml's
      # pack job uploads its own artifacts.
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: '*-${{ inputs.precision }}'
          path: artifacts

      - name: Prepare release assets
        run: |
          chmod +x artifacts/godot-editor-linux-x64-${{ inputs.precision }}/godot.linuxbsd.editor${NATIVE_SUFFIX}.x86_64.executable.mono
          mkdir -p release-assets
          # One zip per artifact, named after the artifact, with the artifact's
          # files at the zip root under their original names.
          for dir in artifacts/*/; do
            name=$(basename "$dir")
            name="${name%-${{ inputs.precision }}}"
            (cd "$dir" && zip -9 -r "$GITHUB_WORKSPACE/release-assets/$name.zip" .)
          done
          echo "Release assets:"
          ls -lh release-assets/

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="godot-${{ needs.preflight.outputs.submodule-hash }}${RELEASE_SUFFIX}"
          # Delete existing release if present (force rebuild case)
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes 2>/dev/null || true
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --latest=false \
            --prerelease \
            --title "Godot Native Libraries ($TAG)" \
            --notes "$(cat <<'EOF'
          ## ${{ inputs.precision }}-precision Native Libraries for Godot submodule ${{ needs.preflight.outputs.submodule-hash }}

          Auto-generated native library build. Used by the `ci.yml` workflow to avoid rebuilding Godot from source on every push.

          ### Included platforms
          - Linux x64 (template_release, template_debug, editor)
          - Windows x64 (template_release, template_debug, editor)
          - macOS arm64 (template_release, template_debug, editor)
          - Browser wasm32 (template_release, template_debug — static library payloads, single-threaded and WasmEnableThreads)
          - Android arm64 and x64 (template_release, template_debug — libgodot_android.so + libc++_shared.so; experimental)

          ### Additional assets
          - `godotsharp.zip` — GodotSharp assemblies (platform-independent)
          - `godotsharp-nupkgs.zip` — GodotSharp NuGet packages
          - `godot-source-generators.zip` — Godot.SourceGenerators.dll
          - `godot-editor-linux-x64.zip` — Linux editor binary (for project import)
          - `godot-android-java.zip` — Godot's Android Java host (`debug/godot.aar`, `release/godot.aar`)
          EOF
          )" \
            release-assets/*

      # Keep the newest 5 cache releases per precision; --cleanup-tag also
      # removes the side-effect git tag gh release create left behind.
      # Accepted consequence: a long-lived branch whose hash was pruned
      # rebuilds inline on its next push.
      - name: Prune old native releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,createdAt \
            -q '[.[] | select(.tagName | test("^godot-[0-9a-f]{7}${{ env.RELEASE_SUFFIX }}$"))] | sort_by(.createdAt) | reverse | .[5:] | .[].tagName' |
          while read -r tag; do
            echo "Pruning $tag"
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          done
