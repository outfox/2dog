name: Set up the MAUI .NET SDK
description: Install the SDK and MAUI workload set from global.json into a private root.
inputs:
  workloads:
    description: Space-separated workload IDs
    default: maui-windows maui-android maui-ios ios
runs:
  using: composite
  steps:
    # Outside the image's MSI-based root, workloads install as plain files: about a minute instead of five for
    # one MSI per pack, and only the requested workloads instead of updating everything the image registered.
    - uses: actions/setup-dotnet@v6
      env:
        DOTNET_INSTALL_DIR: ${{ runner.temp }}/maui-dotnet
      with:
        global-json-file: global.json

    - shell: bash
      env:
        WORKLOADS: ${{ inputs.workloads }}
      run: |
        # shellcheck disable=SC2086 # the list is word-split on purpose
        version=$(sed -nE 's/.*"workloadVersion": "([^"]+)".*/\1/p' global.json)
        test -n "$version"
        dotnet workload install $WORKLOADS --version "$version" --source https://api.nuget.org/v3/index.json
